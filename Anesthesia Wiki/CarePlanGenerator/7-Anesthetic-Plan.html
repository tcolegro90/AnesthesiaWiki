<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anesthetic Plan</title>
  <link rel="stylesheet" href="shared.css?v=16" />
  <style>
    .add-row-btn {
      margin-top: 6px;
      padding: 3px 12px;
      font-size: 12px;
      border: 1px dashed #4a6fa5;
      border-radius: 4px;
      background: #f0f5ff;
      color: #4a6fa5;
      cursor: pointer;
      font-weight: 600;
    }
    .add-row-btn:hover { background: #dde8ff; }
    .repeat-row { display: flex; align-items: center; gap: 6px; }
    .repeat-row .remove-btn {
      border: none; background: none;
      color: #bbb; font-size: 18px;
      cursor: pointer; line-height: 1;
      padding: 0 4px; flex-shrink: 0;
    }
    .repeat-row .remove-btn:hover { color: #c0392b; }
    .auto-note {
      display: none;
      margin-left: 8px;
      padding: 2px 6px;
      border: 1px solid #e5b2b2;
      border-radius: 4px;
      background: #fff0f0;
      color: #b32424;
      font-weight: 700;
      font-size: 11px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>7. Anesthetic Plan</h1>
    <div class="nav">
      <a href="1-Patient-Demographics.html">1 Demographics</a><a href="2-Labs-Chemistries.html">2 Labs</a><a href="3-PMH.html">3 PMH</a><a href="4-Prescribed-Medications.html">4 Home Meds</a><a href="5-Preop-History.html">5 Preop Hx</a><a href="6-Airway-Exam.html">6 Airway</a><a href="6b-Extras.html">6b Extras</a><a href="7-Anesthetic-Plan.html">7 Anesthetic Plan</a><a href="7b-APFEL-PONV.html">7b APFEL/PONV</a><a href="8-Fluid-Blood-Plan.html">8 Fluid/Blood</a>
    </div>

    <div class="card" style="display:flex;flex-direction:column;gap:12px;">

      <div class="row" style="padding-left:0;">
        <div><label>Anesthesia Type</label><br><select id="anes-type" class="long" onchange="toggleGeneralOptions(); onAnyPlanInput();"><option value="">Select...</option><option>General</option><option>MAC</option><option>Sedation</option><option>Spinal</option><option>Epidural</option></select></div>
        <div id="tiva-wrap" style="display:none;"><label><input type="checkbox" id="tiva-box" onchange="toggleTivaReason(); onAnyPlanInput();"> TIVA</label></div>
        <div id="tiva-reason-wrap" style="display:none;"><label>TIVA reason</label><br><select id="tiva-reason" class="med" onchange="toggleTivaOther(); onAnyPlanInput();"><option value="">Reason...</option><option>MH history</option><option>PONV</option><option>Other</option></select> <input id="tiva-other" class="med" style="display:none;" placeholder="Specify"></div>
        <div id="mh-banner" style="display:none;"><span style="color:#dc3545;font-size:1.3em;font-weight:900;letter-spacing:1px;">&#9888; MALIGNANT HYPERTHERMIA</span></div>
      </div>

      <div id="general-options" style="display:none;">
        <div class="grid">
          <div>
            <label>Airway Method</label><br>
            <select id="ind-airway-method" class="med"><option>DL</option><option>VL</option><option>FI</option><option>LMA</option></select>
            <span id="airway-auto-note" class="auto-note">Auto-selected: Potential difficult airway</span>
          </div>
          <div id="row-ind-rsi">
            <label>RSI</label><br>
            <label><input type="radio" id="ind-rsi-yes" name="ind-rsi" value="Yes" onchange="triggerCrossConditions()"> Yes</label>
            <label><input type="radio" id="ind-rsi-no" name="ind-rsi" value="No" onchange="triggerCrossConditions()"> No</label>
            <span id="rsi-auto-note" class="auto-note">Auto-selected: Patient not fasted</span>
          </div>
          <div>
            <label>Anxiolytic?</label><br>
            <div style="display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;">
              <div>
                <label><input type="radio" name="ind-anxiolytic-yn" id="ind-anxiolytic-yes" value="Yes"> Yes</label>
                <label><input type="radio" name="ind-anxiolytic-yn" id="ind-anxiolytic-no" value="No"> No</label>
              </div>
              <div id="anxiolytic-wrap" style="display:none;">
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                  <select id="ind-anxiolytic-select" class="med">
                    <option value="">Select...</option>
                    <option>Midazolam</option>
                    <option>Lorazepam</option>
                    <option>Diazepam</option>
                    <option>Hydroxyzine</option>
                    <option>Alprazolam</option>
                    <option>Dexmedetomidine</option>
                  </select>
                  <input id="ind-anxiolytic-dose" class="small" placeholder="Dose" />
                  <span id="ind-anxiolytic-range" class="muted"></span>
                </div>
              </div>
            </div>
          </div>
          <div style="grid-column:1/-1;">
            <label>Blunt Adrenergic Response <span class="muted" style="font-weight:400;">(before induction)</span></label><br>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px;">
              <select id="ind-blunt-select" class="med">
                <option value="">Select...</option>
                <option>Fentanyl</option>
                <option>Esmolol</option>
                <option>Remifentanil</option>
                <option>Dexmedetomidine</option>
              </select>
              <input id="ind-blunt-dose" class="small" placeholder="Dose" />
              <span id="ind-blunt-range" class="muted"></span>
            </div>
          </div>
          <div>
            <label>Induction Agent</label><br>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px;">
              <select id="ind-agent-select" class="med"><option value="">Select...</option><option>Propofol</option><option>Etomidate</option><option>Ketamine</option><option>Midazolam</option></select>
              <input id="ind-agent-dose" class="small" placeholder="Dose" />
              <span id="ind-agent-range" class="muted"></span>
            </div>
            <!-- Vesicant pain (propofol only) -->
            <div id="row-vesicant" style="display:none;margin-top:6px;">
              <label>Vesicant Pain</label><br>
              <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;">
                <label><input type="radio" name="vesicant-prop" value="0"> None</label>
                <label><input type="radio" name="vesicant-prop" value="50"> Propofol 50 mg</label>
                <label><input type="radio" name="vesicant-prop" value="100"> Propofol 100 mg</label>
              </div>
            </div>
          </div>
          <div id="row-ind-paralytic">
            <label>Paralytic</label><br>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px;">
              <select id="ind-paralytic" class="med"><option value="">Select...</option><option>Succinylcholine</option><option>Rocuronium</option><option>Cisatracurium</option><option>Vecuronium</option></select>
              <input id="ind-paralytic-dose" class="small" placeholder="Dose" />
              <span id="ind-paralytic-range" class="muted"></span>
            </div>
            <div id="sux-warning" class="muted" style="display:none;color:#b32424;font-weight:700;">Contraindication alert</div>
          </div>
          <!-- Inhalation + MAC on same row -->
          <div style="display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;">
            <div><label>Inhalation Agent</label><br><select id="ind-inhalation" class="med" onchange="onAnyPlanInput()"><option value="">Select...</option><option>Sevoflurane</option><option>Isoflurane</option><option>Desflurane</option><option>Nitrous Oxide</option></select></div>
            <div id="mac-wrap" style="display:none;"><label>MAC</label><br><select id="ind-mac-plan" class="small"><option value="">—</option><option>0.1</option><option>0.2</option><option>0.3</option><option>0.4</option><option>0.5</option><option>0.6</option><option>0.7</option><option>0.8</option><option>0.9</option><option>1.0</option><option>1.1</option><option>1.2</option><option>1.3</option><option>1.4</option><option>1.5</option></select></div>
          </div>
          <!-- Intra-op Pain Management -->
          <div style="grid-column:1/-1;">
            <label>Intra-op Pain Management</label>
            <div id="intraop-rows" style="display:flex;flex-direction:column;gap:6px;margin-top:6px;"></div>
            <button type="button" class="add-row-btn" onclick="addPainRow('intraop')">+ Add</button>
          </div>
          <!-- Post-op Pain Management -->
          <div style="grid-column:1/-1;">
            <label>Post-op Pain Management</label>
            <div id="postop-rows" style="display:flex;flex-direction:column;gap:6px;margin-top:6px;"></div>
            <button type="button" class="add-row-btn" onclick="addPainRow('postop')">+ Add</button>
          </div>
          <!-- Non-Opioid Pain Adjuncts -->
          <div style="grid-column:1/-1;">
            <label>Non-Opioid Pain Adjuncts</label>
            <div id="nonopioid-rows" style="display:flex;flex-direction:column;gap:6px;margin-top:6px;"></div>
            <button type="button" class="add-row-btn" onclick="addPainRow('nonopioid')">+ Add</button>
          </div>
        </div>
      </div>


    </div>
  </div>
  <script src="med-catalog.js"></script>
  <script src="shared.js?v=23"></script>
  <script src="plan.js?v=2"></script>

<style>
.global-home-btn {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 9999;
  padding: 12px 18px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.45);
  background: linear-gradient(135deg, #0d6e6e, #1e8f5b);
  color: #ffffff;
  text-decoration: none;
  font-weight: 700;
  letter-spacing: 0.2px;
  box-shadow: 0 10px 24px rgba(0,0,0,0.25);
}
.global-home-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 14px 28px rgba(0,0,0,0.32);
}
.global-home-btn:active {
  transform: translateY(0);
}
</style>
<script>
(function () {
  if (window.self !== window.top) return;
  var path = window.location.pathname;
  var depth = path.split("/").filter(Boolean).length;
  var base = "";
  for (var i = 1; i < depth; i++) { base += "../"; }
  var a = document.createElement("a");
  a.className = "global-home-btn";
  a.href = base + "AnesthesiaWiki.html";
  a.textContent = "Home";
  a.setAttribute("aria-label", "Go to Home");
  document.body.appendChild(a);
})();
</script>
</body>
</html>
