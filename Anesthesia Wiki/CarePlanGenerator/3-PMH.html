<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PMH</title>
  <link rel="stylesheet" href="shared.css?v=3" />
  <style>
    .pmh-checkbox-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px 12px;
    }
    .pmh-checkbox-grid label {
      display: flex;
      align-items: center;
      min-width: 0;
      white-space: normal;
      word-break: break-word;
    }
    .pmh-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .pmh-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
    }
    .pmh-row input {
      flex: 1;
    }
    .row-remove-btn {
      border: none;
      background: none;
      color: #bbb;
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
      padding: 0 4px;
      flex-shrink: 0;
    }
    .row-remove-btn:hover { color: #c0392b; }
    .add-row-btn {
      margin-top: 8px;
      padding: 3px 12px;
      font-size: 12px;
      border: 1px dashed #4a6fa5;
      border-radius: 4px;
      background: #f0f5ff;
      color: #4a6fa5;
      cursor: pointer;
      font-weight: 600;
    }
    .add-row-btn:hover { background: #dde8ff; }
    .surgical-history-panel {
      margin: 0;
      padding: 10px 12px;
      border: 1px solid #d6e4f5;
      border-left: 4px solid #4a6fa5;
      border-radius: 6px;
      background: #f7fbff;
    }
    .surgical-history-title {
      font-weight: 700;
      color: #1f3f66;
      display: block;
      margin-bottom: 6px;
    }

    @media (max-width: 900px) {
      .pmh-checkbox-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .pmh-checkbox-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px 10px;
      }
      .pmh-row {
        min-width: 0;
      }
      .pmh-row input {
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>3. Past Medical History</h1>
    <div class="nav">
      <a href="1-Patient-Demographics.html">1 Demographics</a><a href="2-Labs-Chemistries.html">2 Labs</a><a href="3-PMH.html">3 PMH</a><a href="4-Prescribed-Medications.html">4 Home Meds</a><a href="5-Preop-History.html">5 Preop Hx</a><a href="6-Airway-Exam.html">6 Airway</a><a href="6b-Extras.html">6b Extras</a><a href="7-Anesthetic-Plan.html">7 Anesthetic Plan</a><a href="7b-APFEL-PONV.html">7b APFEL/PONV</a><a href="8-Fluid-Blood-Plan.html">8 Fluid/Blood</a>
    </div>
    <div class="card">
      <div class="pmh-checkbox-grid">
        <label><input type="checkbox" id="pmh-htn"> HTN</label>
        <label><input type="checkbox" id="pmh-hld"> HLD</label>
        <label><input type="checkbox" id="pmh-gerd"> GERD</label>
        <label><input type="checkbox" id="pmh-dm"> DM</label>
        <label><input type="checkbox" id="pmh-afib"> A-fib</label>
        <label><input type="checkbox" id="pmh-cad"> CAD</label>
        <label><input type="checkbox" id="pmh-chf"> CHF</label>
        <label><input type="checkbox" id="pmh-ckd"> CKD</label>
        <label><input type="checkbox" id="pmh-copd"> COPD</label>
        <label><input type="checkbox" id="pmh-asthma"> Asthma</label>
        <label><input type="checkbox" id="pmh-osa"> OSA</label>
        <label><input type="checkbox" id="pmh-obesity"> Obesity</label>
        <label><input type="checkbox" id="pmh-hypothyroid"> Hypothyroid</label>
        <label><input type="checkbox" id="pmh-stroketia"> Stroke/TIA</label>
        <label><input type="checkbox" id="pmh-seizure"> Seizures</label>
        <label><input type="checkbox" id="pmh-anemia"> Anemia</label>
        <label><input type="checkbox" id="pmh-liver"> Liver Disease</label>
        <label><input type="checkbox" id="pmh-chronicpain"> Chronic Pain</label>
        <label><input type="checkbox" id="pmh-depanx"> Dep/Anxi</label>
        <label><input type="checkbox" id="pmh-cancer"> Cancer</label>
      </div>
      <hr>
      <div id="pmh-list" class="pmh-list"></div>
      <button type="button" class="add-row-btn" onclick="addPmhRow()">+ Add more</button>
    </div>

    <div class="card">
      <div class="surgical-history-panel">
        <label class="surgical-history-title">Past Surgical History</label>
        <textarea id="pmh-surgical-history" class="long" style="width:100%;min-height:110px;resize:vertical;" placeholder="List previous surgeries, dates if known..."></textarea>
      </div>
    </div>
  </div>
  <script src="shared.js?v=23"></script>
  <script>
    var pmhRowCount = 0;

    function addPmhRow(value) {
      if (pmhRowCount >= 30) return;
      pmhRowCount++;

      var row = document.createElement('div');
      row.className = 'pmh-row';

      var input = document.createElement('input');
      input.className = 'long';
      input.placeholder = 'PMH item';
      if (value) input.value = value;
      input.addEventListener('input', savePmhRows);

      var rm = document.createElement('button');
      rm.type = 'button';
      rm.className = 'row-remove-btn';
      rm.textContent = '×';
      rm.onclick = function() {
        row.remove();
        if (document.querySelectorAll('#pmh-list .pmh-row').length === 0) addPmhRow('');
        savePmhRows();
      };

      row.appendChild(input);
      row.appendChild(rm);
      document.getElementById('pmh-list').appendChild(row);
      savePmhRows();
    }

    function savePmhRows() {
      var s = getGlobalState();
      var rows = Array.from(document.querySelectorAll('#pmh-list .pmh-row input')).map(function(el) {
        return el.value || '';
      });
      s['pmh-list'] = JSON.stringify(rows);
      setGlobalState(s);
    }

    function restorePmhRows() {
      var list = document.getElementById('pmh-list');
      list.innerHTML = '';
      pmhRowCount = 0;

      var s = getGlobalState();
      var rows = [];
      try { rows = JSON.parse(s['pmh-list']) || []; } catch (e) {}
      if (!rows.length) rows = [''];

      rows.forEach(function(item) {
        addPmhRow(item || '');
      });
    }

    function saveSurgicalHistory() {
      var s = getGlobalState();
      s['pmh-surgical-history'] = document.getElementById('pmh-surgical-history').value;
      setGlobalState(s);
    }
    
    function restoreSurgicalHistory() {
      var s = getGlobalState();
      document.getElementById('pmh-surgical-history').value = s['pmh-surgical-history'] || '';
    }

    pageBoot(function() {
      document.getElementById('pmh-surgical-history').addEventListener('input', saveSurgicalHistory);
      restorePmhRows();
      restoreSurgicalHistory();
    }, function() {
      restorePmhRows();
      restoreSurgicalHistory();
    });
  </script>

<style>
.global-home-btn {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 9999;
  padding: 12px 18px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.45);
  background: linear-gradient(135deg, #0d6e6e, #1e8f5b);
  color: #ffffff;
  text-decoration: none;
  font-weight: 700;
  letter-spacing: 0.2px;
  box-shadow: 0 10px 24px rgba(0,0,0,0.25);
}
.global-home-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 14px 28px rgba(0,0,0,0.32);
}
.global-home-btn:active {
  transform: translateY(0);
}
</style>
<script>
(function () {
  if (window.self !== window.top) return;
  var path = window.location.pathname;
  var depth = path.split("/").filter(Boolean).length;
  var base = "";
  for (var i = 1; i < depth; i++) { base += "../"; }
  var a = document.createElement("a");
  a.className = "global-home-btn";
  a.href = base + "AnesthesiaWiki.html";
  a.textContent = "Home";
  a.setAttribute("aria-label", "Go to Home");
  document.body.appendChild(a);
})();
</script>
</body>
</html>
