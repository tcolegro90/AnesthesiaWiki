<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preoperative History</title>
  <link rel="stylesheet" href="shared.css?v=3" />
</head>
<body>
  <div class="container">
    <h1>5. Preoperative History</h1>
    <div class="nav">
      <a href="1-Patient-Demographics.html">1 Demographics</a><a href="2-Labs-Chemistries.html">2 Labs</a><a href="3-PMH.html">3 PMH</a><a href="4-Prescribed-Medications.html">4 Home Meds</a><a href="5-Preop-History.html">5 Preop Hx</a><a href="6-Airway-Exam.html">6 Airway</a><a href="6b-Extras.html">6b Extras</a><a href="7-Anesthetic-Plan.html">7 Anesthetic Plan</a><a href="7b-APFEL-PONV.html">7b APFEL/PONV</a><a href="8-Fluid-Blood-Plan.html">8 Fluid/Blood</a>
    </div>

    <div class="card" style="display:flex;flex-direction:column;gap:8px;">
      <div class="risk-row" id="row-mets"><strong>METs &lt;4:</strong> <span><label><input type="radio" name="hx-mets" value="Yes"> Yes</label> <label><input type="radio" name="hx-mets" value="No"> No</label></span></div>
      <div class="risk-row" id="row-ponv"><strong>PONV / Motion Sickness:</strong> <span><label><input type="radio" name="hx-ponv" value="Yes"> Yes</label> <label><input type="radio" name="hx-ponv" value="No"> No</label></span></div>
      <div class="risk-row" id="row-famhx"><strong>Family Hx Anes Complications:</strong> <span><label><input type="radio" name="hx-famhx" value="Yes"> Yes</label> <label><input type="radio" name="hx-famhx" value="No"> No</label></span></div>
      <div class="risk-row" id="row-mh"><strong>Malignant Hyperthermia Hx:</strong> <span><label><input type="radio" name="hx-mh" value="Yes"> Yes</label> <label><input type="radio" name="hx-mh" value="No"> No</label></span></div>
      <div class="risk-row" id="row-pseudo"><strong>Pseudocholinesterase Def:</strong> <span><label><input type="radio" name="hx-pseudo" value="Yes"> Yes</label> <label><input type="radio" name="hx-pseudo" value="No"> No</label></span></div>
    </div>
  </div>
  <script src="shared.js?v=23"></script>
  <script>
    function paintRiskRow(name, rowId) {
      const yes = document.querySelector('input[name="' + name + '"][value="Yes"]');
      const row = document.getElementById(rowId);
      row.classList.remove('alert');
      if (yes && yes.checked) row.classList.add('alert');
    }
    function boot() {
      ['hx-mets','hx-ponv','hx-famhx','hx-mh','hx-pseudo'].forEach(name => {
        document.querySelectorAll('input[name="' + name + '"]').forEach(r => {
          r.addEventListener('change', function() {
            paintRiskRow('hx-mets', 'row-mets');
            paintRiskRow('hx-ponv', 'row-ponv');
            paintRiskRow('hx-famhx', 'row-famhx');
            paintRiskRow('hx-mh', 'row-mh');
            paintRiskRow('hx-pseudo', 'row-pseudo');
            saveState();
          });
        });
      });
      paintRiskRow('hx-mets', 'row-mets');
      paintRiskRow('hx-ponv', 'row-ponv');
      paintRiskRow('hx-famhx', 'row-famhx');
      paintRiskRow('hx-mh', 'row-mh');
      paintRiskRow('hx-pseudo', 'row-pseudo');
    }
    pageBoot(boot);
  </script>
</body>
</html>
