<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Surgical Antibiotics Prophylaxis — SMH</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --line: #d3dce8;
      --text: #1d2938;
      --muted: #5a6a7e;
      --accent: #1a4f82;
      --accent-soft: #e8f0fa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: radial-gradient(circle at 15% 0%, #ffffff 0%, var(--bg) 45%, #eaeff8 100%);
      color: var(--text);
      padding: 70px 16px 38px;
    }

    .page {
      max-width: 960px;
      margin: 0 auto;
    }

    .hero {
      background: linear-gradient(135deg, #eef4fc 0%, #ffffff 72%);
      border: 1px solid #c8d9ee;
      border-left: 6px solid var(--accent);
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 10px 26px rgba(26, 55, 100, 0.09);
    }

    .hero h1 {
      margin: 0;
      color: var(--accent);
      font-size: 1.45rem;
      line-height: 1.35;
    }

    .hero p {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.45;
      max-width: 760px;
      font-size: 0.92rem;
    }

    .section {
      margin-top: 24px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 4px 14px rgba(30, 48, 80, 0.05);
    }

    .section h2 {
      margin: 0 0 12px;
      font-size: 0.98rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #2a5080;
    }

    .implications {
      margin: 0 0 14px;
      padding: 12px 13px;
      border-left: 4px solid #1a4f82;
      border-radius: 10px;
      background: #e8f0fa;
      color: #1a3050;
      line-height: 1.5;
      font-size: 0.91rem;
    }

    .pdf-wrapper {
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #f0f4f9;
    }

    .pdf-wrapper object {
      display: block;
      width: 100%;
      height: 75vh;
      min-height: 500px;
      border: none;
    }

    .pdf-fallback {
      padding: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .actions {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #abc5df;
      background: #eef5fc;
      color: #173f67;
      text-decoration: none;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }

    .action-btn:hover {
      background: #e0edf8;
    }

    .meta {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .focus-panel {
      margin-top: 14px;
      padding: 12px 13px;
      border: 1px solid #9ec0e3;
      border-left: 5px solid #1a4f82;
      border-radius: 10px;
      background: #eef6ff;
      display: none;
    }
    .focus-panel strong {
      color: #143b63;
    }
    .focus-panel .focus-text {
      margin-top: 4px;
      color: #1e3f5f;
      font-size: 0.9rem;
      line-height: 1.45;
    }

    @media (max-width: 700px) {
      body { padding-top: 16px; }
      .hero { padding: 14px; }
      .hero h1 { font-size: 1.2rem; }
      .pdf-wrapper iframe { height: 60vh; }
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="hero">
      <h1>Antibiotics for Surgical Prophylaxis in Adult Patients</h1>
      <p>University of Rochester — Strong Memorial Hospital &nbsp;·&nbsp; Last Revised 2/11/2026 &nbsp;·&nbsp; PolicyStat ID 19501893</p>
    </section>

    <section class="section">
      <h2>Document</h2>
      <div class="pdf-wrapper" id="pdfWrapper">
        <object
          data="SMH-Surgical-Antibiotics-Prophylaxis-2026.pdf"
          type="application/pdf"
          title="Antibiotics for Surgical Prophylaxis in Adult Patients — SMH 2026"
        >
          <div class="pdf-fallback">
            <p>Your browser cannot display this PDF inline.</p>
            <a class="action-btn" href="SMH-Surgical-Antibiotics-Prophylaxis-2026.pdf" target="_blank" rel="noopener noreferrer">Open PDF</a>
          </div>
        </object>
      </div>

      <p class="meta">Source: URMC Strong Memorial Hospital Antimicrobial Stewardship. Effective 2/11/2026 · Next Review 2/10/2029.</p>
    </section>
  </div>

  <script>
    var APP_VERSION = '20260415a';

    (function ensureVersionedPage() {
      var currentUrl = new URL(window.location.href);
      if (currentUrl.searchParams.get('v') === APP_VERSION) return;
      currentUrl.searchParams.set('v', APP_VERSION);
      window.location.replace(currentUrl.toString());
    })();

    (function applyFocusContextFromQuery() {
      var url = new URL(window.location.href);
      var focusDrug = url.searchParams.get('focusDrug') || '';
      var focusDose = url.searchParams.get('focusDose') || '';
      var focusRedose = url.searchParams.get('focusRedose') || '';
      var focusSurgery = url.searchParams.get('focusSurgery') || '';
      var focusReason = url.searchParams.get('focusReason') || '';
      var focusMatched = url.searchParams.get('focusMatched') || '';
      var focusReference = url.searchParams.get('focusReference') || '';
      var focusSearch = url.searchParams.get('focusSearch') || '';
      if (!focusDrug && !focusSearch) return;

      var panel = document.getElementById('focusPanel');
      var text = document.getElementById('focusText');
      var searchLink = document.getElementById('focusPdfSearch');
      if (!panel || !text || !searchLink) return;

      var details = focusDrug ? ('Suggested regimen: ' + focusDrug) : 'Suggestion context received from Care Plan.';
      if (focusDose) details += ' | Dose: ' + focusDose;
      if (focusRedose) details += ' | Redose: ' + focusRedose;
      if (focusSurgery) details += ' | Surgery context: ' + focusSurgery;
      if (focusReason) details += ' | Rule match: ' + focusReason;
      if (focusMatched) details += ' | Matched terms: ' + focusMatched;
      if (focusReference) details += ' | Ref cue: ' + focusReference;
      text.textContent = details + '. Verify final choice with local protocol and clinical judgment.';

      var searchTerm = focusSearch || focusDrug;
      searchLink.href = 'SMH-Surgical-Antibiotics-Prophylaxis-2026.pdf#search=' + encodeURIComponent(searchTerm);
      panel.style.display = 'block';
    })();

    // Show fallback message if PDF iframe fails to load
    window.addEventListener('pageshow', function (event) {
      var navigationEntry = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
      if (event.persisted || (navigationEntry && navigationEntry.type === 'back_forward')) {
        window.location.reload();
      }
    });
  </script>
<style>
.global-home-btn {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 9999;
  padding: 12px 18px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.45);
  background: linear-gradient(135deg, #0d6e6e, #1e8f5b);
  color: #ffffff;
  text-decoration: none;
  font-weight: 700;
  letter-spacing: 0.2px;
  box-shadow: 0 10px 24px rgba(0,0,0,0.25);
}
.global-home-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 14px 28px rgba(0,0,0,0.32);
}
.global-home-btn:active { transform: translateY(0); }
</style>
<script>
(function () {
  if (window.self !== window.top) return;
  var path = window.location.pathname;
  var depth = path.split('/').filter(Boolean).length;
  var base = '';
  for (var i = 1; i < depth; i++) { base += '../'; }
  var a = document.createElement('a');
  a.className = 'global-home-btn';
  a.href = base + 'AnesthesiaWiki.html';
  a.textContent = 'Home';
  a.setAttribute('aria-label', 'Go to Home');
  document.body.appendChild(a);
})();
</script>
</body>
</html>
