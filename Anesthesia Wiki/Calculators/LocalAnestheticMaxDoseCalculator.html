<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Local Anesthetic Max Dose Calculator</title>
  <style>
    :root {
      --ink: #1f2a37;
      --line: #dbe5f0;
      --bg: #f3f7fb;
      --ok: #1a7c50;
      --warn: #b32424;
      --caution: #8a5c00;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    .wrap {
      max-width: 900px;
      margin: 28px auto;
      padding: 0 16px 32px;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 22px;
      color: #114a8d;
    }
    .subtitle {
      font-size: 13px;
      color: #5a6b82;
      margin-bottom: 20px;
    }
    .page-title {
      margin: 0;
    }
    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px 18px;
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #355f93;
      margin: 0 0 12px;
    }

    /* Collapsible reference section */
    .ref-details {
      width: 100%;
    }
    .ref-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      list-style: none;
      user-select: none;
      margin: 0;
      padding: 0;
    }
    .ref-summary::-webkit-details-marker {
      display: none;
    }
    .ref-summary .card-title {
      margin: 0;
    }
    .ref-summary::after {
      content: 'Show';
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #5a6b82;
    }
    .ref-details[open] .ref-summary::after {
      content: 'Hide';
    }
    .ref-details .ref-table-wrap {
      margin-top: 12px;
    }

    /* Weight row */
    .weight-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .weight-row label {
      font-size: 15px;
      font-weight: 600;
    }
    #weight-kg {
      width: 80px;
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      border: 2px solid #aac4e8;
      border-radius: 8px;
      padding: 6px 8px;
      color: #114a8d;
    }
    #weight-kg:focus { outline: none; border-color: #114a8d; }
    #weight-kg.empty {
      border-color: #c0392b;
      background: #fff5f5;
      color: #c0392b;
    }
    #weight-kg.empty::placeholder { color: #e08080; }
    .unit-label {
      font-size: 15px;
      color: #5a6b82;
    }
    .max-label {
      margin-left: auto;
      font-size: 13px;
      color: #5a6b82;
    }

    /* Agent card */
    .agent-row {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .agent-row-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .agent-row-top select {
      flex: 1;
      border: 1px solid #c9d7e8;
      border-radius: 6px;
      min-height: 38px;
      padding: 5px 8px;
      font-size: 15px;
      font-weight: 600;
      background: #fff;
      color: #114a8d;
    }
    .agent-row-top select:focus { outline: none; border-color: #5b9bd5; }
    .agent-row-mid {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 10px;
    }
    .epi-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #355f93;
      cursor: pointer;
      user-select: none;
    }
    .epi-label input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #114a8d;
    }
    .agent-row-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .input-group label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #7a8fa8;
    }
    .input-group input {
      width: 100%;
      border: 1px solid #c9d7e8;
      border-radius: 6px;
      min-height: 42px;
      padding: 5px 10px;
      font-size: 18px;
      font-weight: 700;
      background: #fff;
      text-align: center;
      color: #114a8d;
    }
    .input-group input:focus { outline: none; border-color: #5b9bd5; }

    /* Progress bar cell */
    .bar-cell { display: flex; flex-direction: column; gap: 4px; }
    .bar-nums {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
    }
    .bar-nums .given { font-weight: 700; }
    .bar-nums .maxlabel { color: #7a8fa8; }
    .bar-track {
      height: 10px;
      border-radius: 5px;
      background: #e8f0f9;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 5px;
      background: var(--ok);
      transition: width 0.15s, background 0.15s;
    }
    .bar-fill.caution { background: #d4920a; }
    .bar-fill.over { background: var(--warn); }
    .bar-pct {
      font-size: 12px;
      font-weight: 700;
      color: var(--ok);
    }
    .bar-pct.caution { color: var(--caution); }
    .bar-pct.over { color: var(--warn); }

    /* Remove button */
    .rm-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #b0bcce;
      font-size: 18px;
      line-height: 1;
      padding: 4px;
      border-radius: 4px;
      transition: color 0.1s;
    }
    .rm-btn:hover { color: #b32424; }

    /* Add agent button */
    #add-row {
      margin-top: 10px;
      background: #eaf3ff;
      border: 1px dashed #aac4e8;
      border-radius: 7px;
      color: #114a8d;
      font-weight: 600;
      font-size: 14px;
      padding: 7px 14px;
      cursor: pointer;
      width: 100%;
    }
    #add-row:hover { background: #d8ecff; }

    /* Combined index */
    .index-row {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .index-score {
      font-size: 28px;
      font-weight: 800;
      min-width: 70px;
    }
    .index-score.ok { color: var(--ok); }
    .index-score.caution { color: var(--caution); }
    .index-score.over { color: var(--warn); }
    .index-bar-wrap { flex: 1; min-width: 160px; }
    .index-bar-track {
      height: 14px;
      border-radius: 7px;
      background: #e8f0f9;
      overflow: hidden;
      margin-bottom: 5px;
    }
    .index-bar-fill {
      height: 100%;
      border-radius: 7px;
      background: var(--ok);
      transition: width 0.15s, background 0.15s;
    }
    .index-bar-fill.caution { background: #d4920a; }
    .index-bar-fill.over { background: var(--warn); }
    .index-msg {
      font-size: 13px;
      color: #5a6b82;
    }
    .index-msg.over { color: var(--warn); font-weight: 600; }
    .index-msg.caution { color: var(--caution); font-weight: 600; }

    /* Reference table */
    .ref-table-wrap {
      overflow-x: hidden;
    }
    .ref-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .ref-table th {
      background: #f0f6ff;
      font-size: 11px;
      color: #355f93;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 7px 10px;
      text-align: left;
    }
    .ref-table td {
      padding: 8px 10px;
      border-bottom: 1px solid #eef2f8;
    }
    .ref-table tr:last-child td { border-bottom: none; }
    .ref-table tr:hover td { background: #f7fbff; }
    .ref-table td:first-child { font-weight: 600; }

    @media (max-width: 700px) {
      .wrap {
        margin-top: 16px;
      }
      .page-title {
        font-size: 14px;
        line-height: 1.1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 10px;
      }
      .subtitle {
        display: none;
      }
      .ref-table thead {
        display: none;
      }
      .ref-table,
      .ref-table tbody,
      .ref-table tr,
      .ref-table td {
        display: block;
        width: 100%;
      }
      .ref-table tr {
        border: 1px solid #dbe5f0;
        border-radius: 8px;
        margin-bottom: 10px;
        overflow: hidden;
        background: #fff;
      }
      .ref-table td {
        border-bottom: 1px solid #eef2f8;
        padding: 8px 10px;
      }
      .ref-table td:last-child {
        border-bottom: none;
      }
      .ref-table td::before {
        content: attr(data-label);
        display: block;
        font-size: 10px;
        color: #7a8fa8;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 2px;
      }
    }

    /* Ghost placeholder for max-volume suggestion */
    .vol-input::placeholder {
      color: #a8bccc;
      font-style: italic;
      font-size: 13px;
    }
  </style>
</head>
<body>
<div style="position:fixed;top:10px;left:10px;z-index:9999;display:flex;gap:8px;">
<button type="button" onclick="window.history.back()" style="background:#1f2a37;color:#fff;border:none;text-decoration:none;padding:7px 13px;border-radius:20px;font-size:0.8rem;font-weight:600;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;box-shadow:0 2px 8px rgba(0,0,0,0.25);cursor:pointer;">&#8592; Back</button>
<a href="../AnesthesiaWiki.html" style="background:#1f2a37;color:#fff;text-decoration:none;padding:7px 13px;border-radius:20px;font-size:0.8rem;font-weight:600;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;box-shadow:0 2px 8px rgba(0,0,0,0.25);display:flex;align-items:center;">Wiki Home</a>
</div>
  <div class="wrap">
    <h1 class="page-title">Local Anesthetic Max Dose Calculator</h1>
    <div class="subtitle">Enter patient weight and add agents below. Doses update in real time.</div>

    <div class="card">
      <div class="weight-row">
        <label for="weight-kg">Weight</label>
        <input id="weight-kg" type="number" min="1" step="0.1" inputmode="decimal" placeholder="kg" />
        <span class="unit-label">kg</span>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Agents</div>
      <div id="rows"></div>
      <button id="add-row" type="button">+ Add Agent</button>
    </div>

    <div class="card">
      <div class="card-title">Combined Exposure</div>
      <div class="index-row">
        <div id="index-score" class="index-score ok">0%</div>
        <div class="index-bar-wrap">
          <div class="index-bar-track">
            <div id="index-bar" class="index-bar-fill" style="width:0%"></div>
          </div>
          <div id="index-msg" class="index-msg">Enter volumes above to calculate.</div>
        </div>
      </div>
    </div>

    <div class="card">
      <details class="ref-details">
        <summary class="ref-summary">
          <div class="card-title">Max Dose Reference</div>
        </summary>
        <div class="ref-table-wrap">
          <table class="ref-table" id="ref-table">
            <thead>
              <tr>
                <th>Drug</th>
                <th>Without Epi</th>
                <th>Max (no epi)</th>
                <th>With Epi</th>
                <th>Max (epi)</th>
              </tr>
            </thead>
            <tbody id="ref-body"></tbody>
          </table>
        </div>
      </details>
    </div>
  </div>

  <script>
    var DRUGS = {
      Lidocaine:      { noEpi: { mgkg: 4.5, cap: 300 }, epi: { mgkg: 7,  cap: 500  }, defaultConc: 1    },
      Bupivacaine:    { noEpi: { mgkg: 2.5, cap: 175 }, epi: { mgkg: 3,  cap: 225  }, defaultConc: 0.25 },
      Ropivacaine:    { noEpi: { mgkg: 3,   cap: 225 }, epi: { mgkg: 3,  cap: 225  }, defaultConc: 0.5  },
      Mepivacaine:    { noEpi: { mgkg: 4.5, cap: 300 }, epi: { mgkg: 7,  cap: 500  }, defaultConc: 1    },
      Chloroprocaine: { noEpi: { mgkg: 11,  cap: 800 }, epi: { mgkg: 14, cap: 1000 }, defaultConc: 2    }
    };

    function mgFromPercentAndVolume(percent, ml) {
      return (percent * 10) * ml;
    }

    function maxForDrug(drugName, useEpi, weightKg) {
      var d = DRUGS[drugName];
      if (!d) return 0;
      var lim = useEpi ? d.epi : d.noEpi;
      return Math.min(lim.mgkg * weightKg, lim.cap);
    }

    function newRow() {
      var rowDiv = document.createElement('div');
      rowDiv.className = 'agent-row';

      // Top row: drug select + remove button
      var rowTop = document.createElement('div');
      rowTop.className = 'agent-row-top';
      var drug = document.createElement('select');
      Object.keys(DRUGS).forEach(function(name) {
        var opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        drug.appendChild(opt);
      });
      var rm = document.createElement('button');
      rm.type = 'button';
      rm.className = 'rm-btn';
      rm.title = 'Remove';
      rm.textContent = '×';
      rm.addEventListener('click', function() { rowDiv.remove(); recalc(); });
      rowTop.appendChild(drug);
      rowTop.appendChild(rm);

      // Mid row: epi checkbox
      var rowMid = document.createElement('div');
      rowMid.className = 'agent-row-mid';
      var epiLabel = document.createElement('label');
      epiLabel.className = 'epi-label';
      var epi = document.createElement('input');
      epi.type = 'checkbox';
      epiLabel.appendChild(epi);
      epiLabel.appendChild(document.createTextNode('+ Epinephrine'));
      rowMid.appendChild(epiLabel);

      // Inputs row: conc + volume
      var rowInputs = document.createElement('div');
      rowInputs.className = 'agent-row-inputs';

      var concGroup = document.createElement('div');
      concGroup.className = 'input-group';
      var concLabel = document.createElement('label');
      concLabel.textContent = 'Concentration %';
      var conc = document.createElement('input');
      conc.type = 'number';
      conc.step = '0.05';
      conc.min = '0';
      conc.setAttribute('inputmode', 'decimal');
      conc.value = DRUGS[drug.value].defaultConc;
      concGroup.appendChild(concLabel);
      concGroup.appendChild(conc);

      var volGroup = document.createElement('div');
      volGroup.className = 'input-group';
      var volLabel = document.createElement('label');
      volLabel.textContent = 'Volume mL';
      var vol = document.createElement('input');
      vol.type = 'number';
      vol.step = '1';
      vol.min = '0';
      vol.setAttribute('inputmode', 'numeric');
      vol.placeholder = 'mL';
      vol.className = 'vol-input';
      volGroup.appendChild(volLabel);
      volGroup.appendChild(vol);

      rowInputs.appendChild(concGroup);
      rowInputs.appendChild(volGroup);

      // Progress bar cell
      var barCell = document.createElement('div');
      barCell.className = 'bar-cell';
      var barNums = document.createElement('div');
      barNums.className = 'bar-nums';
      var givenSpan = document.createElement('span');
      givenSpan.className = 'given';
      givenSpan.textContent = '0.0 mg';
      var maxSpan = document.createElement('span');
      maxSpan.className = 'maxlabel';
      maxSpan.textContent = 'max 0.0 mg';
      barNums.appendChild(givenSpan);
      barNums.appendChild(maxSpan);
      var barTrack = document.createElement('div');
      barTrack.className = 'bar-track';
      var barFill = document.createElement('div');
      barFill.className = 'bar-fill';
      barFill.style.width = '0%';
      barTrack.appendChild(barFill);
      var pctSpan = document.createElement('span');
      pctSpan.className = 'bar-pct';
      pctSpan.textContent = '0%';
      barCell.appendChild(barNums);
      barCell.appendChild(barTrack);
      barCell.appendChild(pctSpan);

      rowDiv.appendChild(rowTop);
      rowDiv.appendChild(rowMid);
      rowDiv.appendChild(rowInputs);
      rowDiv.appendChild(barCell);

      rowDiv._givenSpan = givenSpan;
      rowDiv._maxSpan = maxSpan;
      rowDiv._barFill = barFill;
      rowDiv._pctSpan = pctSpan;
      rowDiv._drug = drug;
      rowDiv._epi = epi;
      rowDiv._conc = conc;
      rowDiv._vol = vol;

      [drug, conc, vol].forEach(function(el) { el.addEventListener('input', recalc); });
      drug.addEventListener('change', function() { conc.value = DRUGS[drug.value].defaultConc; recalc(); });
      epi.addEventListener('change', recalc);

      document.getElementById('rows').appendChild(rowDiv);
      recalc();
    }

    function recalc() {
      var wt = parseFloat(document.getElementById('weight-kg').value) || 0;
      var rowDivs = Array.from(document.querySelectorAll('#rows .agent-row'));
      var rowStats = [];
      var totalFraction = 0;

      rowDivs.forEach(function(row) {
        var drugName = row._drug.value;
        var useEpi = row._epi.checked;
        var concVal = parseFloat(row._conc.value) || 0;
        var volVal = parseFloat(row._vol.value) || 0;

        var givenMg = mgFromPercentAndVolume(concVal, volVal);
        var maxMg = wt > 0 ? maxForDrug(drugName, useEpi, wt) : 0;
        var fraction = maxMg > 0 ? (givenMg / maxMg) : 0;
        rowStats.push({
          row: row,
          concVal: concVal,
          givenMg: givenMg,
          maxMg: maxMg,
          fraction: fraction
        });
        totalFraction += fraction;
      });

      var remainingFraction = Math.max(0, 1 - totalFraction);

      rowStats.forEach(function(stat) {
        var pct = Math.round(stat.fraction * 100);
        var barPct = Math.min(stat.fraction * 100, 100);
        var remainingMg = remainingFraction * stat.maxMg;
        var remainingMl = (stat.maxMg > 0 && stat.concVal > 0) ? remainingMg / (stat.concVal * 10) : 0;

        stat.row._vol.placeholder = (wt > 0 && stat.concVal > 0) ? remainingMl.toFixed(1) : 'mL';
        stat.row._givenSpan.textContent = stat.givenMg.toFixed(1) + ' mg';
        stat.row._maxSpan.textContent = 'max ' + stat.maxMg.toFixed(0) + ' mg';
        stat.row._barFill.style.width = barPct + '%';
        stat.row._pctSpan.textContent = pct + '%';

        var cls = stat.fraction > 1 ? 'over' : stat.fraction >= 0.8 ? 'caution' : '';
        stat.row._barFill.className = 'bar-fill' + (cls ? ' ' + cls : '');
        stat.row._pctSpan.className = 'bar-pct' + (cls ? ' ' + cls : '');
      });

      var pct = Math.round(totalFraction * 100);
      var barPct = Math.min(totalFraction * 100, 100);
      var cls = totalFraction >= 1 ? 'over' : totalFraction >= 0.8 ? 'caution' : 'ok';

      var scoreEl = document.getElementById('index-score');
      var barEl = document.getElementById('index-bar');
      var msgEl = document.getElementById('index-msg');

      scoreEl.textContent = pct + '%';
      scoreEl.className = 'index-score ' + cls;
      barEl.style.width = barPct + '%';
      barEl.className = 'index-bar-fill' + (cls !== 'ok' ? ' ' + cls : '');
      msgEl.className = 'index-msg' + (cls !== 'ok' ? ' ' + cls : '');

      if (!wt || wt <= 0) {
        msgEl.textContent = 'Enter weight above to calculate.';
      } else if (totalFraction >= 1) {
        msgEl.textContent = 'Limit reached. Stop.';
      } else if (totalFraction >= 0.8) {
        msgEl.textContent = 'Approaching limit. Use caution before adding more.';
      } else if (totalFraction > 0) {
        msgEl.textContent = 'Within safe range.';
      } else {
        msgEl.textContent = 'Enter volumes above to calculate.';
      }
    }

    function renderReference() {
      var tbody = document.getElementById('ref-body');
      Object.keys(DRUGS).forEach(function(name) {
        var d = DRUGS[name];
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td data-label="Drug">' + name + '</td>' +
          '<td data-label="Without Epi">' + d.noEpi.mgkg + ' mg/kg</td>' +
          '<td data-label="Max (no epi)">' + d.noEpi.cap + ' mg</td>' +
          '<td data-label="With Epi">' + d.epi.mgkg + ' mg/kg</td>' +
          '<td data-label="Max (epi)">' + d.epi.cap + ' mg</td>';
        tbody.appendChild(tr);
      });
    }

    function checkWeight() {
      var el = document.getElementById('weight-kg');
      var wt = parseFloat(el.value);
      if (!wt || wt <= 0) {
        el.classList.add('empty');
      } else {
        el.classList.remove('empty');
      }
    }

    document.getElementById('add-row').addEventListener('click', newRow);
    document.getElementById('weight-kg').addEventListener('input', function() {
      checkWeight();
      recalc();
    });
    checkWeight();
    renderReference();
    newRow();
  </script>
</body>
</html>
