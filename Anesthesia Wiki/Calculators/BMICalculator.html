<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <style>
        :root { --primary:#1f2a37; --blue:#114a8d; --line:#dbe5f0; --bg:#f3f7fb; }
        * { box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--primary); margin:0; padding-bottom:48px; }
        header { background:var(--primary); padding:16px 20px 12px; text-align:center; }
        header h1 { margin:0; font-size:1.4rem; color:#fff; }
        header p { margin:4px 0 0; font-size:0.82rem; color:#93adc8; }
        .container { max-width:520px; margin:36px auto; padding:0 16px; }
        .card { background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
        .card-header { background:var(--blue); color:#fff; padding:13px 18px; font-size:1rem; font-weight:700; }
        .card-body { padding:24px; }
        .field { margin-bottom:16px; }
        .field-row { display:flex; gap:10px; margin-bottom:16px; }
        .field-row .field { flex:1; margin-bottom:0; }
        .units-group {
            margin-bottom:14px;
            padding:12px;
            border:1px solid #dbe5f0;
            border-radius:8px;
            background:#f8fbff;
        }
        .measure-columns {
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:12px;
            margin-bottom:14px;
        }
        .measure-columns .units-group { margin-bottom:0; }
        .units-title {
            margin:0 0 10px;
            font-size:0.8rem;
            font-weight:700;
            letter-spacing:0.03em;
            color:#355f93;
            text-transform:uppercase;
        }
        label { display:block; font-size:0.85rem; font-weight:600; color:#355f93; margin-bottom:5px; }
        input, select {
            width:100%; height:72px; padding:10px 12px; border:1px solid #c9d7e8; border-radius:14px;
            font-size:1rem; color:var(--primary); background:#fff;
        }
        input:focus, select:focus { outline:none; border-color:var(--blue); }
        .calc-btn {
            width:100%; padding:11px; background:var(--blue); color:#fff; border:none;
            border-radius:7px; font-size:1rem; font-weight:700; cursor:pointer; margin-top:4px;
        }
        .calc-btn:hover { background:#0d3d7a; }
        .result {
            margin-top:16px; padding:14px; background:#eaf3ff; border:1px solid #c0d8f5;
            border-radius:8px; font-size:0.95rem; line-height:1.7; min-height:48px;
        }
        .bmi-bar-wrap { margin-top:12px; }
        .bmi-bar-track { height:12px; border-radius:6px; background:#f0f0f0; overflow:hidden; position:relative; }
        .bmi-bar-fill { height:100%; border-radius:6px; background:#1a7c50; transition:width 0.3s; }
        .bmi-labels { display:flex; justify-content:space-between; font-size:0.72rem; color:#7a8fa8; margin-top:4px; }
        .err { color:#b32424; }
        @media (max-width:640px) {
            .measure-columns { grid-template-columns:1fr; gap:10px; }
            .field-row { gap:8px; }
            label { font-size:0.8rem; }
            input { padding:8px 10px; }
        }
    </style>
</head>
<body>
<div style="position:fixed;top:10px;left:10px;z-index:9999;display:flex;gap:8px;">


</div>

<header>
    <h1>⚖️ BMI Calculator</h1>
    <p>Body Mass Index using US or metric units</p>
</header>

<div class="container">
    <div class="card">
        <div class="card-header">BMI Calculator</div>
        <div class="card-body">
            <div class="measure-columns">
                <div class="units-group">
                    <p class="units-title">Height</p>
                    <div class="field-row">
                        <div class="field">
                            <label for="bmi-height-in">Height</label>
                            <input type="number" id="bmi-height-in" min="1" inputmode="decimal" placeholder="inches">
                        </div>
                        <div class="field">
                            <label for="bmi-height-cm">Height</label>
                            <input type="number" id="bmi-height-cm" min="1" inputmode="decimal" placeholder="cm">
                        </div>
                    </div>
                </div>

                <div class="units-group">
                    <p class="units-title">Weight</p>
                    <div class="field-row">
                        <div class="field">
                            <label for="bmi-weight-lb">Weight</label>
                            <input type="number" id="bmi-weight-lb" min="1" inputmode="decimal" placeholder="lbs">
                        </div>
                        <div class="field">
                            <label for="bmi-weight-kg">Weight</label>
                            <input type="number" id="bmi-weight-kg" min="1" inputmode="decimal" placeholder="kg">
                        </div>
                    </div>
                </div>
            </div>

            <button class="calc-btn" onclick="calculateBMI()">Calculate BMI</button>
            <div id="bmi-result" class="result"><em style="color:#8a9ab0;">Enter values above and calculate.</em></div>
            <div class="bmi-bar-wrap" id="bmi-bar-wrap" style="display:none;">
                <div class="bmi-bar-track">
                    <div class="bmi-bar-fill" id="bmi-bar-fill"></div>
                </div>
                <div class="bmi-labels">
                    <span>Underweight&lt;18.5</span><span>Normal 18.5–25</span><span>Overweight 25–30</span><span>Obese 30+</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
var bmiSyncLock = false;

function calculateBMI() {
    var heightIn = parseFloat(document.getElementById('bmi-height-in').value) || 0;
    var heightCm = parseFloat(document.getElementById('bmi-height-cm').value) || 0;
    var weightLb = parseFloat(document.getElementById('bmi-weight-lb').value) || 0;
    var weightKg = parseFloat(document.getElementById('bmi-weight-kg').value) || 0;

    var heightM = 0;
    if (heightCm > 0) heightM = heightCm / 100;
    else if (heightIn > 0) heightM = heightIn * 0.0254;

    var weightKgFinal = 0;
    if (weightKg > 0) weightKgFinal = weightKg;
    else if (weightLb > 0) weightKgFinal = weightLb * 0.45359237;

    if (heightM <= 0 || weightKgFinal <= 0) {
        document.getElementById('bmi-result').innerHTML = "<span class='err'>Enter height in inches or cm, and weight in lbs or kg.</span>";
        document.getElementById('bmi-bar-wrap').style.display = 'none';
        return;
    }

    var bmi = weightKgFinal / (heightM * heightM);

    if (bmi <= 0 || !isFinite(bmi)) {
        document.getElementById('bmi-result').innerHTML = "<span class='err'>Please enter a valid height and weight.</span>";
        document.getElementById('bmi-bar-wrap').style.display = 'none';
        return;
    }

    var rounded = bmi.toFixed(1);
    var category, color;
    if (bmi < 18.5)      { category = 'Underweight';           color = '#5b9bd5'; }
    else if (bmi < 25)   { category = 'Normal weight';          color = '#1a7c50'; }
    else if (bmi < 30)   { category = 'Overweight';             color = '#d4920a'; }
    else if (bmi < 35)   { category = 'Obesity — Class I';      color = '#b32424'; }
    else if (bmi < 40)   { category = 'Obesity — Class II';     color = '#8a1c1c'; }
    else                 { category = 'Extreme Obesity (III)';  color = '#5a0a0a'; }

    document.getElementById('bmi-result').innerHTML =
        '<strong>BMI:</strong> ' + rounded + ' &nbsp;|&nbsp; <strong style="color:' + color + '">' + category + '</strong>';

    var pct = Math.min(Math.max((bmi / 50) * 100, 5), 100);
    document.getElementById('bmi-bar-fill').style.width = pct + '%';
    document.getElementById('bmi-bar-fill').style.background = color;
    document.getElementById('bmi-bar-wrap').style.display = 'block';
}

function syncHeightFromInches() {
    if (bmiSyncLock) return;
    var inches = parseFloat(document.getElementById('bmi-height-in').value) || 0;
    bmiSyncLock = true;
    document.getElementById('bmi-height-cm').value = inches > 0 ? (inches * 2.54).toFixed(1) : '';
    bmiSyncLock = false;
}

function syncHeightFromCm() {
    if (bmiSyncLock) return;
    var cm = parseFloat(document.getElementById('bmi-height-cm').value) || 0;
    bmiSyncLock = true;
    document.getElementById('bmi-height-in').value = cm > 0 ? (cm / 2.54).toFixed(1) : '';
    bmiSyncLock = false;
}

function syncWeightFromLbs() {
    if (bmiSyncLock) return;
    var lbs = parseFloat(document.getElementById('bmi-weight-lb').value) || 0;
    bmiSyncLock = true;
    document.getElementById('bmi-weight-kg').value = lbs > 0 ? (lbs * 0.45359237).toFixed(1) : '';
    bmiSyncLock = false;
}

function syncWeightFromKg() {
    if (bmiSyncLock) return;
    var kg = parseFloat(document.getElementById('bmi-weight-kg').value) || 0;
    bmiSyncLock = true;
    document.getElementById('bmi-weight-lb').value = kg > 0 ? (kg / 0.45359237).toFixed(1) : '';
    bmiSyncLock = false;
}

function setupAutoSyncAndCalc() {
    var heightIn = document.getElementById('bmi-height-in');
    var heightCm = document.getElementById('bmi-height-cm');
    var weightLb = document.getElementById('bmi-weight-lb');
    var weightKg = document.getElementById('bmi-weight-kg');

    heightIn.addEventListener('input', function() {
        syncHeightFromInches();
        calculateBMI();
    });

    heightCm.addEventListener('input', function() {
        syncHeightFromCm();
        calculateBMI();
    });

    weightLb.addEventListener('input', function() {
        syncWeightFromLbs();
        calculateBMI();
    });

    weightKg.addEventListener('input', function() {
        syncWeightFromKg();
        calculateBMI();
    });
}

document.addEventListener('keydown', function(e) { if (e.key === 'Enter') calculateBMI(); });
setupAutoSyncAndCalc();
</script>

<style>
.global-home-btn {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 9999;
  padding: 12px 18px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.45);
  background: linear-gradient(135deg, #0d6e6e, #1e8f5b);
  color: #ffffff;
  text-decoration: none;
  font-weight: 700;
  letter-spacing: 0.2px;
  box-shadow: 0 10px 24px rgba(0,0,0,0.25);
}
.global-home-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 14px 28px rgba(0,0,0,0.32);
}
.global-home-btn:active {
  transform: translateY(0);
}
</style>
<script>
(function () {
  var path = window.location.pathname;
  var depth = path.split("/").filter(Boolean).length;
  var base = "";
  for (var i = 1; i < depth; i++) { base += "../"; }
  var a = document.createElement("a");
  a.className = "global-home-btn";
  a.href = base + "AnesthesiaWiki.html";
  a.textContent = "Home";
  a.setAttribute("aria-label", "Go to Home");
  document.body.appendChild(a);
})();
</script>
</body>
</html>
