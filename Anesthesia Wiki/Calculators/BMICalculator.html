<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <style>
        :root { --primary:#1f2a37; --blue:#114a8d; --line:#dbe5f0; --bg:#f3f7fb; }
        * { box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--primary); margin:0; padding-bottom:48px; }
        header { background:var(--primary); padding:16px 20px 12px; text-align:center; }
        header h1 { margin:0; font-size:1.4rem; color:#fff; }
        header p { margin:4px 0 0; font-size:0.82rem; color:#93adc8; }
        .container { max-width:520px; margin:36px auto; padding:0 16px; }
        .card { background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
        .card-header { background:var(--blue); color:#fff; padding:13px 18px; font-size:1rem; font-weight:700; }
        .card-body { padding:24px; }
        .field { margin-bottom:16px; }
        label { display:block; font-size:0.85rem; font-weight:600; color:#355f93; margin-bottom:5px; }
        input, select {
            width:100%; padding:9px 12px; border:1px solid #c9d7e8; border-radius:7px;
            font-size:1rem; color:var(--primary); background:#fff;
        }
        input:focus, select:focus { outline:none; border-color:var(--blue); }
        .calc-btn {
            width:100%; padding:11px; background:var(--blue); color:#fff; border:none;
            border-radius:7px; font-size:1rem; font-weight:700; cursor:pointer; margin-top:4px;
        }
        .calc-btn:hover { background:#0d3d7a; }
        .result {
            margin-top:16px; padding:14px; background:#eaf3ff; border:1px solid #c0d8f5;
            border-radius:8px; font-size:0.95rem; line-height:1.7; min-height:48px;
        }
        .bmi-bar-wrap { margin-top:12px; }
        .bmi-bar-track { height:12px; border-radius:6px; background:#f0f0f0; overflow:hidden; position:relative; }
        .bmi-bar-fill { height:100%; border-radius:6px; background:#1a7c50; transition:width 0.3s; }
        .bmi-labels { display:flex; justify-content:space-between; font-size:0.72rem; color:#7a8fa8; margin-top:4px; }
        .err { color:#b32424; }
    </style>
</head>
<body>
<a href="../Index.html" style="position:fixed;top:10px;left:10px;z-index:9999;background:#1f2a37;color:#fff;text-decoration:none;padding:7px 13px;border-radius:20px;font-size:0.8rem;font-weight:600;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;box-shadow:0 2px 8px rgba(0,0,0,0.25);">&#8592; Wiki Home</a>

<header>
    <h1>⚖️ BMI Calculator</h1>
    <p>Body Mass Index using US units</p>
</header>

<div class="container">
    <div class="card">
        <div class="card-header">BMI Calculator</div>
        <div class="card-body">
            <div class="field">
                <label for="bmi-feet">Height — Feet</label>
                <input type="number" id="bmi-feet" min="1" max="8" placeholder="e.g. 5">
            </div>
            <div class="field">
                <label for="bmi-inches">Height — Inches</label>
                <input type="number" id="bmi-inches" min="0" max="11" placeholder="e.g. 10">
            </div>
            <div class="field">
                <label for="bmi-weight">Weight (lbs)</label>
                <input type="number" id="bmi-weight" min="1" placeholder="e.g. 165">
            </div>
            <button class="calc-btn" onclick="calculateBMI()">Calculate BMI</button>
            <div id="bmi-result" class="result"><em style="color:#8a9ab0;">Enter values above and calculate.</em></div>
            <div class="bmi-bar-wrap" id="bmi-bar-wrap" style="display:none;">
                <div class="bmi-bar-track">
                    <div class="bmi-bar-fill" id="bmi-bar-fill"></div>
                </div>
                <div class="bmi-labels">
                    <span>Underweight&lt;18.5</span><span>Normal 18.5–25</span><span>Overweight 25–30</span><span>Obese 30+</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function calculateBMI() {
    var feet = parseInt(document.getElementById('bmi-feet').value) || 0;
    var inches = parseInt(document.getElementById('bmi-inches').value) || 0;
    var weight = parseFloat(document.getElementById('bmi-weight').value) || 0;
    if ((feet === 0 && inches === 0) || weight === 0) {
        document.getElementById('bmi-result').innerHTML = "<span class='err'>Please enter a valid height and weight.</span>";
        document.getElementById('bmi-bar-wrap').style.display = 'none';
        return;
    }
    var totalInches = (feet * 12) + inches;
    var bmi = (weight / (totalInches * totalInches)) * 703;
    var rounded = bmi.toFixed(1);
    var category, color;
    if (bmi < 18.5)      { category = 'Underweight';           color = '#5b9bd5'; }
    else if (bmi < 25)   { category = 'Normal weight';          color = '#1a7c50'; }
    else if (bmi < 30)   { category = 'Overweight';             color = '#d4920a'; }
    else if (bmi < 35)   { category = 'Obesity — Class I';      color = '#b32424'; }
    else if (bmi < 40)   { category = 'Obesity — Class II';     color = '#8a1c1c'; }
    else                 { category = 'Extreme Obesity (III)';  color = '#5a0a0a'; }

    document.getElementById('bmi-result').innerHTML =
        '<strong>BMI:</strong> ' + rounded + ' &nbsp;|&nbsp; <strong style="color:' + color + '">' + category + '</strong>';

    var pct = Math.min(Math.max((bmi / 50) * 100, 5), 100);
    document.getElementById('bmi-bar-fill').style.width = pct + '%';
    document.getElementById('bmi-bar-fill').style.background = color;
    document.getElementById('bmi-bar-wrap').style.display = 'block';
}

document.addEventListener('keydown', function(e) { if (e.key === 'Enter') calculateBMI(); });
</script>
</body>
</html>
