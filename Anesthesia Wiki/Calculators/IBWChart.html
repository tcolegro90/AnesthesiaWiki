<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBW &amp; Ventilation Chart</title>
    <style>
        :root { --primary:#1f2a37; --blue:#114a8d; --line:#dbe5f0; --bg:#f3f7fb; }
        * { box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--primary); margin:0; padding-bottom:48px; }
        header { background:var(--primary); padding:16px 20px 12px; text-align:center; }
        header h1 { margin:0; font-size:1.4rem; color:#fff; }
        header p { margin:4px 0 0; font-size:0.82rem; color:#93adc8; }
        .container { max-width:860px; margin:28px auto; padding:0 16px; }
        .card { background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:18px; }
        .card-header { background:var(--blue); color:#fff; padding:13px 18px; font-size:1rem; font-weight:700; }
        .card-body { padding:18px; }
        p { font-size:0.9rem; line-height:1.6; margin:0 0 12px; color:#3a4a5c; }
        table { width:100%; border-collapse:collapse; font-size:0.85rem; }
        th { background:#f0f6ff; color:#355f93; font-size:0.78rem; text-transform:uppercase; letter-spacing:0.04em; padding:8px 10px; text-align:left; }
        td { padding:8px 10px; border-bottom:1px solid #eef2f8; }
        tbody tr:nth-child(odd) td { background:#fcfdff; }
        tbody tr:nth-child(even) td { background:#f3f8ff; }
        tr:last-child td { border-bottom:none; }
        tr:hover td { background:#e8f2ff; }
        td:first-child { font-weight:600; }
        /* Sex toggle in card header */
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .sex-toggle-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: rgba(255,255,255,0.75);
            user-select: none;
        }
        .sex-toggle-wrap .lbl-active { color: #fff; }
        /* Pill slider */
        .toggle-track {
            position: relative;
            width: 52px;
            height: 26px;
            background: rgba(255,255,255,0.2);
            border-radius: 13px;
            cursor: pointer;
            transition: background 0.25s;
            flex-shrink: 0;
        }
        .toggle-track.female { background: rgba(255,180,210,0.45); }
        .toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            transition: left 0.22s cubic-bezier(.4,0,.2,1);
            box-shadow: 0 1px 4px rgba(0,0,0,0.25);
        }
        .toggle-track.female .toggle-thumb { left: 29px; }
        /* Hidden checkbox drives the toggle */
        .toggle-input { position:absolute; opacity:0; width:0; height:0; }

        /* Female mode: push overall look to pink and away from blue */
        .female-mode .card-header {
            background: linear-gradient(135deg, #b63a6f, #d95788);
        }
        .female-mode th {
            background: #ffe8f1;
            color: #8a1f4f;
        }
        .female-mode tbody tr:nth-child(odd) td { background: #fff8fb; }
        .female-mode tbody tr:nth-child(even) td { background: #ffeef5; }
        .female-mode tr:hover td { background: #ffdce9; }
        .female-mode td:first-child { color: #6f2a48; }
    </style>
</head>
<body>
<div style="position:fixed;top:10px;left:10px;z-index:9999;display:flex;gap:8px;">
<button type="button" onclick="window.history.back()" style="background:#1f2a37;color:#fff;border:none;text-decoration:none;padding:7px 13px;border-radius:20px;font-size:0.8rem;font-weight:600;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;box-shadow:0 2px 8px rgba(0,0,0,0.25);cursor:pointer;">&#8592; Back</button>
<a href="../AnesthesiaWiki.html" style="background:#1f2a37;color:#fff;text-decoration:none;padding:7px 13px;border-radius:20px;font-size:0.8rem;font-weight:600;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;box-shadow:0 2px 8px rgba(0,0,0,0.25);display:flex;align-items:center;">Wiki Home</a>
</div>

<header>
    <h1>📏 IBW &amp; Ventilation Chart</h1>
    <p>Ideal Body Weight and protective tidal volume targets by height</p>
</header>

<div class="container">
    <div class="card">
        <div class="card-header">
            <span>Ideal Body Weight &amp; Tidal Volume Reference</span>
            <div class="sex-toggle-wrap">
                <span id="lbl-male" class="lbl-active">Male</span>
                <label>
                    <input type="checkbox" class="toggle-input" id="sex-toggle" onchange="updateTable()">
                    <div class="toggle-track" id="toggle-track">
                        <div class="toggle-thumb"></div>
                    </div>
                </label>
                <span id="lbl-female">Female</span>
            </div>
        </div>
        <div class="card-body">
            <p>Calculated using the Devine Formula.</p>
            <table>
                <thead>
                    <tr>
                        <th>Height</th>
                        <th id="th-ibw">Male IBW (kg)</th>
                        <th>TV @ 6 mL/kg</th>
                        <th>TV @ 7 mL/kg</th>
                        <th>TV @ 8 mL/kg</th>
                    </tr>
                </thead>
                <tbody id="ibw-tbody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // [height label, male IBW, female IBW]
    var rows = [
        ["4' 10\" (147 cm)", 45.4, 40.9],
        ["4' 11\" (150 cm)", 47.7, 43.2],
        ["5' 0\" (152 cm)",  50.0, 45.5],
        ["5' 1\" (155 cm)",  52.3, 47.8],
        ["5' 2\" (157 cm)",  54.6, 50.1],
        ["5' 3\" (160 cm)",  56.9, 52.4],
        ["5' 4\" (163 cm)",  59.2, 54.7],
        ["5' 5\" (165 cm)",  61.5, 57.0],
        ["5' 6\" (168 cm)",  63.8, 59.3],
        ["5' 7\" (170 cm)",  66.1, 61.6],
        ["5' 8\" (173 cm)",  68.4, 63.9],
        ["5' 9\" (175 cm)",  70.7, 66.2],
        ["5' 10\" (178 cm)", 73.0, 68.5],
        ["5' 11\" (180 cm)", 75.3, 70.8],
        ["6' 0\" (183 cm)",  77.6, 73.1],
        ["6' 1\" (185 cm)",  79.9, 75.4],
        ["6' 2\" (188 cm)",  82.2, 77.7],
        ["6' 3\" (191 cm)",  84.5, 80.0],
        ["6' 4\" (193 cm)",  86.8, 82.3],
        ["6' 5\" (196 cm)",  89.1, 84.6],
        ["6' 6\" (198 cm)",  91.4, 86.9]
    ];

    function r(n) { return Math.round(n); }

    function updateTable() {
        var isFemale = document.getElementById('sex-toggle').checked;
        var card = document.querySelector('.card');
        var track = document.getElementById('toggle-track');
        var lblM = document.getElementById('lbl-male');
        var lblF = document.getElementById('lbl-female');
        var thIBW = document.getElementById('th-ibw');

        if (card) card.classList.toggle('female-mode', isFemale);
        track.className = 'toggle-track' + (isFemale ? ' female' : '');
        lblM.className = isFemale ? '' : 'lbl-active';
        lblF.className = isFemale ? 'lbl-active' : '';
        thIBW.textContent = isFemale ? 'Female IBW (kg)' : 'Male IBW (kg)';

        var tbody = document.getElementById('ibw-tbody');
        var html = '';
        for (var i = 0; i < rows.length; i++) {
            var ibw = isFemale ? rows[i][2] : rows[i][1];
            html += '<tr>' +
                '<td>' + rows[i][0] + '</td>' +
                '<td>' + ibw.toFixed(1) + ' kg</td>' +
                '<td>' + r(ibw * 6) + ' mL</td>' +
                '<td>' + r(ibw * 7) + ' mL</td>' +
                '<td>' + r(ibw * 8) + ' mL</td>' +
                '</tr>';
        }
        tbody.innerHTML = html;
    }

    updateTable();
</script>
</body>
</html>
