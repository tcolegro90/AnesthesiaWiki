<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Calculator</title>
    <style>
        :root { --primary:#1f2a37; --blue:#114a8d; --teal:#0e7490; --line:#dbe5f0; --bg:#f3f7fb; }
        * { box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--primary); margin:0; padding-bottom:48px; }
        header { background:var(--primary); padding:16px 20px 12px; text-align:center; }
        header h1 { margin:0; font-size:1.4rem; color:#fff; }
        header p { margin:4px 0 0; font-size:0.82rem; color:#93adc8; }
        .container { max-width:520px; margin:36px auto; padding:0 16px; }
        .card { background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:14px; }
        .card-header { background:var(--teal); color:#fff; padding:13px 18px; font-size:1rem; font-weight:700; }
        .card-body { padding:24px; }
        .field { margin-bottom:16px; }
        label { display:block; font-size:0.85rem; font-weight:600; color:#355f93; margin-bottom:5px; }
        input, select {
            width:100%; padding:9px 12px; border:1px solid #c9d7e8; border-radius:7px;
            font-size:1rem; color:var(--primary); background:#fff;
        }
        input:focus, select:focus { outline:none; border-color:var(--teal); }
        .calc-btn {
            width:100%; padding:11px; background:var(--teal); color:#fff; border:none;
            border-radius:7px; font-size:1rem; font-weight:700; cursor:pointer; margin-top:4px;
        }
        .calc-btn:hover { background:#0b5e72; }
        .result {
            margin-top:16px; padding:14px; background:#f0fbff; border:1px solid #b2dded;
            border-radius:8px; font-size:0.93rem; line-height:1.9; min-height:48px;
        }
        .result-row { display:flex; justify-content:space-between; border-bottom:1px solid #d6eef8; padding:4px 0; }
        .result-row:last-child { border-bottom:none; }
        .result-label { color:#5a6b82; }
        .result-val { font-weight:700; color:var(--primary); }
        .err { color:#b32424; }
    </style>
</head>
<body>
<a href="../Index.html" style="position:fixed;top:10px;left:10px;z-index:9999;background:#1f2a37;color:#fff;text-decoration:none;padding:7px 13px;border-radius:20px;font-size:0.8rem;font-weight:600;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;box-shadow:0 2px 8px rgba(0,0,0,0.25);">&#8592; Wiki Home</a>

<header>
    <h1>💧 Fluid Calculator</h1>
    <p>Perioperative fluids using the 4-2-1 rule</p>
</header>

<div class="container">
    <div class="card">
        <div class="card-header">Perioperative Fluid Calculator (4-2-1 Rule)</div>
        <div class="card-body">
            <div class="field">
                <label for="fluid-weight">Weight (kg)</label>
                <input type="number" id="fluid-weight" min="1" placeholder="e.g. 70">
            </div>
            <div class="field">
                <label for="fluid-npo">NPO Time (hours)</label>
                <input type="number" id="fluid-npo" min="0" placeholder="e.g. 8">
            </div>
            <div class="field">
                <label for="fluid-trauma">Surgical Trauma</label>
                <select id="fluid-trauma">
                    <option value="2">Minimal (2 mL/kg/hr)</option>
                    <option value="4" selected>Moderate (4 mL/kg/hr)</option>
                    <option value="6">Severe (6 mL/kg/hr)</option>
                </select>
            </div>
            <button class="calc-btn" onclick="calculateFluid()">Calculate Fluids</button>
            <div id="fluid-result" class="result"><em style="color:#8a9ab0;">Enter values above and calculate.</em></div>
        </div>
    </div>
</div>

<script>
function calculateFluid() {
    var weight = parseFloat(document.getElementById('fluid-weight').value) || 0;
    var npo = parseFloat(document.getElementById('fluid-npo').value) || 0;
    var trauma = parseFloat(document.getElementById('fluid-trauma').value) || 0;
    if (weight <= 0) {
        document.getElementById('fluid-result').innerHTML = "<span class='err'>Please enter a valid weight.</span>";
        return;
    }
    var hourlyMaint;
    if (weight <= 10) {
        hourlyMaint = weight * 4;
    } else if (weight <= 20) {
        hourlyMaint = 40 + ((weight - 10) * 2);
    } else {
        hourlyMaint = 60 + (weight - 20);
    }
    var npoDeficit = hourlyMaint * npo;
    var thirdSpace = weight * trauma;
    var firstHour = (npoDeficit / 2) + hourlyMaint + thirdSpace;

    document.getElementById('fluid-result').innerHTML =
        '<div class="result-row"><span class="result-label">Maintenance Rate</span><span class="result-val">' + hourlyMaint.toFixed(0) + ' mL/hr</span></div>' +
        '<div class="result-row"><span class="result-label">NPO Deficit</span><span class="result-val">' + npoDeficit.toFixed(0) + ' mL total</span></div>' +
        '<div class="result-row"><span class="result-label" style="font-size:0.8rem;color:#8a9ab0;">&nbsp;&nbsp;Give ½ in 1st hr, ¼ in 2nd, ¼ in 3rd</span><span></span></div>' +
        '<div class="result-row"><span class="result-label">3rd Space Loss</span><span class="result-val">' + thirdSpace.toFixed(0) + ' mL/hr</span></div>' +
        '<div class="result-row" style="margin-top:6px;"><span class="result-label" style="font-weight:700;">Est. 1st Hour Total</span><span class="result-val" style="color:#0e7490;">' + firstHour.toFixed(0) + ' mL</span></div>';
}
document.addEventListener('keydown', function(e) { if (e.key === 'Enter') calculateFluid(); });
</script>
</body>
</html>
