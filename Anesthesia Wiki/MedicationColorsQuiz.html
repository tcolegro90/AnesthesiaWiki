<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medication Colors Quiz</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f8f3ed;
      color: #2f2a24;
      margin: 0;
      padding: 0 0 40px 0;
      text-align: center;
    }
    header {
      background: linear-gradient(135deg, #7a3e1d 0%, #b35b2b 100%);
      color: #fff;
      padding: 18px 20px 14px;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: 0.01em;
    }
    .quiz-container {
      margin: 40px auto 0 auto;
      max-width: 400px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(89,53,30,0.09);
      padding: 32px 18px 28px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }
    .quiz-swatch {
      width: 90px;
      height: 90px;
      border-radius: 12px;
      border: 3px solid #e8d8c8;
      margin-bottom: 10px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.10);
    }
    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      margin-top: 10px;
    }
    .quiz-btn {
      padding: 12px 0;
      border: none;
      border-radius: 8px;
      font-size: 1.08rem;
      font-weight: 600;
      background: #f3f3f3;
      color: #2f2a24;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .quiz-btn:hover {
      background: #ffe4b3;
      color: #7a3e1d;
    }
    .quiz-feedback {
      font-size: 1.1rem;
      font-weight: 700;
      margin-top: 18px;
    }
    .quiz-next {
      margin-top: 18px;
      padding: 10px 24px;
      font-size: 1rem;
      border-radius: 7px;
      border: none;
      background: #b35b2b;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .quiz-next:hover {
      background: #7a3e1d;
    }
  </style>
</head>
<body>
  <header>
    <h1>Medication Colors Quiz</h1>
    <p>Which medication class matches this color?</p>
  </header>
  <div class="quiz-container" id="quiz-container">
    <!-- Quiz content will be injected here -->
  </div>
  <script>
    const quizData = [
      { label: "Opioids", color: "#0070C0" },
      { label: "Neuromuscular Blockers", color: "#FF0000" },
      { label: "Induction Agents", color: "#FFF200" },
      { label: "Benzodiazepines", color: "#FF8000" },
      { label: "Local Anesthetics", color: "#B7B7B7" },
      { label: "Vasopressors", color: "#92278F" },
      { label: "Anticholinergics", color: "#00B050" }
    ];

    let currentAnswer = null;

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function newQuiz() {
      const idx = Math.floor(Math.random() * quizData.length);
      const answer = quizData[idx];
      currentAnswer = answer.label;
      const options = shuffle([...quizData.map(q => q.label)]);
      const container = document.getElementById('quiz-container');
      container.innerHTML = `
        <div class="quiz-swatch" style="background: ${answer.color}"></div>
        <div class="quiz-options">
          ${options.map(opt => `<button class="quiz-btn" onclick="checkAnswer('${opt}')">${opt}</button>`).join('')}
        </div>
        <div class="quiz-feedback" id="quiz-feedback"></div>
      `;
    }

    window.checkAnswer = function(opt) {
      const feedback = document.getElementById('quiz-feedback');
      if (opt === currentAnswer) {
        feedback.textContent = 'Correct!';
        feedback.style.color = '#00B050';
      } else {
        feedback.textContent = `Incorrect. Answer: ${currentAnswer}`;
        feedback.style.color = '#b32424';
      }
      feedback.insertAdjacentHTML('beforeend', '<br><button class="quiz-next" onclick="newQuiz()">Next</button>');
      // Disable all buttons
      document.querySelectorAll('.quiz-btn').forEach(btn => btn.disabled = true);
    }

    newQuiz();
  </script>
</body>
</html>
