<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PMH</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    .pmh-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .pmh-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
    }
    .pmh-row input {
      flex: 1;
    }
    .row-remove-btn {
      border: 1px solid #e7b7b7;
      background: #fff4f4;
      color: #8f2424;
      font-size: 12px;
      cursor: pointer;
      line-height: 1.1;
      padding: 5px 8px;
      flex-shrink: 0;
      border-radius: 4px;
      font-weight: 700;
    }
    .row-remove-btn:hover { background: #ffe6e6; border-color: #d68f8f; }
    .pmh-info-btn {
      border: 1px solid #8eaed6;
      background: #f0f6ff;
      color: #1f4f85;
      font-weight: 700;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      line-height: 18px;
      text-align: center;
      font-size: 12px;
      cursor: pointer;
      flex-shrink: 0;
      padding: 0;
    }
    .pmh-info-btn:hover { background: #e4efff; border-color: #6e96c8; }
    .pmh-info-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10,18,32,0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 12000;
      padding: 18px;
      box-sizing: border-box;
    }
    .pmh-info-modal-box {
      background: #fff;
      border-radius: 10px;
      width: min(640px, 100%);
      max-height: 82vh;
      overflow: auto;
      box-shadow: 0 18px 42px rgba(0,0,0,0.22);
      border: 1px solid #d9e2ef;
      padding: 16px 18px 14px;
      position: relative;
    }
    .pmh-info-modal-close {
      position: absolute;
      top: 10px;
      right: 14px;
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: #888;
      line-height: 1;
    }
    .pmh-info-modal-close:hover { color: #222; }
    @media (max-width: 600px) {
      .pmh-row input { max-width: none !important; }
    }
    .add-row-btn {
      margin-top: 8px;
      padding: 3px 12px;
      font-size: 12px;
      border: 1px dashed #4a6fa5;
      border-radius: 4px;
      background: #f0f5ff;
      color: #4a6fa5;
      cursor: pointer;
      font-weight: 600;
    }
    .add-row-btn:hover { background: #dde8ff; }
    .surgical-history-panel {
      margin: 0;
    }
    .surgical-history-title {
      font-weight: 700;
      color: #1f3f66;
      display: block;
      margin-bottom: 6px;
    }

    @media (max-width: 640px) {
      .pmh-row {
        min-width: 0;
      }
      .pmh-row input {
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>4. Past Medical History</h1>
    <div class="nav">
      <a href="1-Patient-Demographics.html">1 Patient</a><a href="2-Surgery.html">2 Surgery</a><a href="3-Labs-Chemistries.html">3 Labs</a><a href="4-PMH.html">4 PMH</a><a href="5-Prescribed-Medications.html">5 Home Meds</a><a href="6-Preop-History.html">6 Preop Hx</a><a href="7-Airway-Exam.html">7 Airway</a><a href="7b-Extras.html">7b Extras</a><a href="8-Anesthetic-Plan.html">8 Anesthetic Plan</a><a href="8b-APFEL-PONV.html">8b APFEL/PONV</a><a href="9-Fluid-Blood-Plan.html">9 Fluid/Blood</a><a href="10-Vent-Settings.html">10 Vent</a>
    </div>
    <div class="card">
      <datalist id="pmh-dx-suggestions"></datalist>
      <div id="pmh-list" class="pmh-list"></div>
      <button type="button" class="add-row-btn" onclick="addPmhRow()">+ Add more</button>
    </div>

    <div class="card">
      <div class="surgical-history-panel">
        <label class="surgical-history-title">Past Surgical History</label>
        <div id="psh-list" class="pmh-list"></div>
        <button type="button" class="add-row-btn" onclick="addPshRow()">+ Add more</button>
      </div>
    </div>

    <!-- PMH info modal -->
    <div id="pmh-info-modal" class="pmh-info-modal-overlay" onclick="if(event.target===this)closePmhInfoModal()">
      <div class="pmh-info-modal-box">
        <button class="pmh-info-modal-close" onclick="closePmhInfoModal()" aria-label="Close">&times;</button>
        <h3 id="pmh-info-name" style="margin:0 0 12px;color:#1a4f82;font-size:17px;padding-right:24px;"></h3>
        <table style="border-collapse:collapse;width:100%;">
          <tr>
            <td style="padding:6px 10px 6px 0;font-weight:700;color:#2b3f59;vertical-align:top;white-space:nowrap;font-size:13px;">Anesthesia Considerations</td>
            <td id="pmh-info-anes" style="padding:6px 0 6px 8px;color:#333;font-size:13px;"></td>
          </tr>
        </table>
      </div>
    </div>
  </div>
  <script src="shared.js"></script>
  <script>
    var pmhRowCount = 0;

    // ── PMH diagnosis autocomplete ──────────────────────────────────────────
    var PMH_DIAGNOSES = [
      // Cardiovascular
      'HTN','Hypertension','HLD','Hyperlipidemia','Hypercholesterolemia','Dyslipidemia',
      'CAD','Coronary Artery Disease','Angina','MI','Myocardial Infarction','CABG','PCI',
      'CHF','Heart Failure','Congestive Heart Failure','HFrEF','HFpEF','A-fib','Atrial Fibrillation',
      'Atrial Flutter','PAD','Peripheral Arterial Disease','PVD','Aortic Stenosis',
      'Aortic Regurgitation','Mitral Regurgitation','Mitral Stenosis','Cardiomyopathy',
      'Pacemaker','ICD','WPW','DVT','PE','Pulmonary Embolism','Pulmonary Hypertension',
      'Hypertrophic Cardiomyopathy','Dilated Cardiomyopathy','Endocarditis',
      // Pulmonary
      'COPD','Emphysema','Chronic Bronchitis','Asthma','OSA','Obstructive Sleep Apnea',
      'Sleep Apnea','Pulmonary Fibrosis','IPF','Sarcoidosis','Pleural Effusion',
      'Reactive Airway Disease','Bronchiectasis','Cystic Fibrosis',
      // Endocrine / Metabolic
      'DM','Diabetes','Type 2 Diabetes','Type 1 Diabetes','T2DM','T1DM','Pre-diabetes',
      'Hypothyroidism','Hyperthyroidism','Thyroid Disease','Graves Disease','Hashimoto Thyroiditis',
      'Obesity','Metabolic Syndrome','Adrenal Insufficiency','Cushing Syndrome','Hyperparathyroidism',
      'Hyperaldosteronism','Pheochromocytoma','Acromegaly',
      // Neurological
      'Stroke','TIA','CVA','Transient Ischemic Attack','Seizure Disorder','Epilepsy',
      "Parkinson's Disease",'Parkinsonism',"Alzheimer's Disease",'Dementia','Cognitive Impairment',
      'Multiple Sclerosis','Myasthenia Gravis','ALS','Neuropathy','Peripheral Neuropathy',
      'Migraine','Headache Disorder','Cervical Myelopathy','Lumbar Stenosis','Radiculopathy',
      // Renal
      'CKD','Chronic Kidney Disease','ESRD','End Stage Renal Disease','Renal Failure',
      'Nephrolithiasis','Kidney Stones','Nephrotic Syndrome','Glomerulonephritis','Dialysis',
      // GI / Hepatic
      'GERD','Reflux','Peptic Ulcer Disease','PUD','Crohn Disease','Ulcerative Colitis',
      'IBD','Inflammatory Bowel Disease','IBS','Irritable Bowel Syndrome','Diverticulosis',
      'Diverticulitis','Cirrhosis','Hepatitis','Hepatitis B','Hepatitis C','Liver Disease',
      'NAFLD','NASH','Pancreatitis','Gallstones','Cholelithiasis','Cholecystitis',
      'Celiac Disease','Gastroparesis',
      // Hematological
      'Anemia','Iron Deficiency Anemia','B12 Deficiency','Sickle Cell Disease','Sickle Cell Trait','Thalassemia',
      'Thrombocytopenia','Coagulopathy','Hemophilia','Von Willebrand Disease',
      'Polycythemia Vera','DVT History','Anticoagulation','Factor V Leiden',
      // Rheumatological / Musculoskeletal
      'Arthritis','Rheumatoid Arthritis','RA','Osteoarthritis','Lupus','SLE','Systemic Lupus Erythematosus',
      'Psoriatic Arthritis','Ankylosing Spondylitis','Gout','Fibromyalgia',
      'Polymyalgia Rheumatica','Sjogren Syndrome','Scleroderma','Vasculitis','Myositis',
      // Psychiatric
      'Depression','Major Depressive Disorder','MDD','Anxiety','GAD','Generalized Anxiety Disorder',
      'PTSD','Bipolar Disorder','Schizophrenia','ADHD','Substance Use Disorder',
      'Alcohol Use Disorder','OCD','Panic Disorder','Borderline Personality Disorder',
      // Oncology
      'Cancer','Breast Cancer','Lung Cancer','Colon Cancer','Colorectal Cancer',
      'Prostate Cancer','Bladder Cancer','Kidney Cancer','Thyroid Cancer','Lymphoma',
      'Leukemia','Multiple Myeloma','Melanoma','Ovarian Cancer','Endometrial Cancer',
      'Head and Neck Cancer','Esophageal Cancer','Gastric Cancer','Hepatocellular Carcinoma',
      // Other / Infectious
      'Chronic Pain','Osteoporosis','Osteopenia','HIV','AIDS','Transplant','Kidney Transplant',
      'Liver Transplant','Heart Transplant','Bone Marrow Transplant','Dialysis',
      'Eczema','Psoriasis','Glaucoma','Macular Degeneration','Cataracts',
      'Obesity Hypoventilation Syndrome','OHS','Malnutrition','Chronic Steroid Use',
      'Immunosuppression','Hereditary Angioedema','Latex Allergy'
    ];

    var PMH_LEGACY_CHECKBOX_LABELS = {
      'pmh-htn': 'HTN',
      'pmh-hld': 'HLD',
      'pmh-gerd': 'GERD',
      'pmh-dm': 'DM',
      'pmh-afib': 'A-fib',
      'pmh-cad': 'CAD',
      'pmh-chf': 'CHF',
      'pmh-ckd': 'CKD',
      'pmh-copd': 'COPD',
      'pmh-asthma': 'Asthma',
      'pmh-osa': 'OSA',
      'pmh-obesity': 'Obesity',
      'pmh-hypothyroid': 'Hypothyroid',
      'pmh-stroketia': 'Stroke/TIA',
      'pmh-seizure': 'Seizures',
      'pmh-anemia': 'Anemia',
      'pmh-liver': 'Liver Disease',
      'pmh-chronicpain': 'Chronic Pain',
      'pmh-depression': 'Depression',
      'pmh-anxiety': 'Anxiety',
      'pmh-cancer': 'Cancer'
    };

    var pmhSuggestionsReady = false;
    function ensurePmhSuggestions() {
      if (pmhSuggestionsReady) return;
      var list = document.getElementById('pmh-dx-suggestions');
      if (!list) return;
      var frag = document.createDocumentFragment();
      PMH_DIAGNOSES.forEach(function(dx) {
        var opt = document.createElement('option');
        opt.value = dx;
        frag.appendChild(opt);
      });
      list.appendChild(frag);
      pmhSuggestionsReady = true;
    }

    function getTopPmhSuggestion(typed) {
      if (!typed) return typed;
      var q = typed.toLowerCase();
      var diagnoses = PMH_DIAGNOSES;
      // Prefix match first
      for (var i = 0; i < diagnoses.length; i++) {
        if (diagnoses[i].toLowerCase().indexOf(q) === 0) return diagnoses[i];
      }
      // Contains match fallback
      for (var i = 0; i < diagnoses.length; i++) {
        if (diagnoses[i].toLowerCase().indexOf(q) !== -1) return diagnoses[i];
      }
      return typed;
    }

    function addPmhFromInput(input) {
      if (!input) return;
      var typed = (input.value || '').trim();
      if (!typed) return;

      // Use the top suggestion from the datalist if one exists
      var resolved = getTopPmhSuggestion(typed);
      input.value = resolved;

      savePmhRows();

      var row = input.closest('.pmh-row');
      var rows = Array.from(document.querySelectorAll('#pmh-list .pmh-row'));
      var idx = rows.indexOf(row);
      if (idx >= 0 && idx < rows.length - 1) {
        rows[idx + 1].querySelector('input').focus();
      } else {
        addPmhRow('');
        var all = document.querySelectorAll('#pmh-list .pmh-row');
        var lastInput = all[all.length - 1] && all[all.length - 1].querySelector('input');
        if (lastInput) lastInput.focus();
      }
    }
    // ────────────────────────────────────────────────────────────────────────

    var PMH_ABBREVS = {
      'ms': 'Multiple Sclerosis'
    };

    function normalizePmhInfoKey(text) {
      return String(text || '').toLowerCase().replace(/[^a-z0-9/+ ]/g, ' ').replace(/\s+/g, ' ').trim();
    }

    function getPmhAnesConsiderations(item) {
      var raw = String(item || '').trim();
      if (!raw) return 'None.';
      var key = normalizePmhInfoKey(raw);

      var exact = {
        'htn': 'Potential peri-op BP lability; optimize control and monitor hemodynamics.',
        'hypertension': 'Potential peri-op BP lability; optimize control and monitor hemodynamics.',
        'hld': 'None.',
        'hyperlipidemia': 'None.',
        'gerd': 'Aspiration-risk context; consider reflux/aspiration precautions when indicated.',
        'dm': 'Peri-op glucose management is key; avoid hypo/hyperglycemia and adjust diabetes meds for NPO status.',
        'diabetes': 'Peri-op glucose management is key; avoid hypo/hyperglycemia and adjust diabetes meds for NPO status.',
        'a fib': 'Rate/rhythm and anticoagulation status affect peri-op plan; monitor rhythm and bleeding risk context.',
        'afib': 'Rate/rhythm and anticoagulation status affect peri-op plan; monitor rhythm and bleeding risk context.',
        'cad': 'Ischemic risk context; optimize hemodynamics and continue indicated cardioprotective meds when appropriate.',
        'chf': 'Higher peri-op cardiopulmonary risk; avoid fluid overload and monitor hemodynamics closely.',
        'ckd': 'Drug dosing/fluid/electrolyte considerations; avoid nephrotoxins and monitor renal-sensitive meds.',
        'copd': 'Higher bronchospasm/respiratory risk; optimize pulmonary status and ventilation strategy.',
        'asthma': 'Bronchospasm risk; optimize control and ensure rescue bronchodilator availability.',
        'osa': 'Airway/respiratory depression risk; prioritize opioid-sparing strategy and post-op monitoring.',
        'obesity': 'Difficult airway/hypoventilation risk and dosing considerations; plan airway and ventilation strategy.',
        'hypothyroid': 'Severe untreated disease increases peri-op risk; otherwise usually continue thyroid replacement.',
        'stroke tia': 'Cerebrovascular risk context; avoid major BP swings and assess antithrombotic plan.',
        'seizures': 'Continue antiseizure meds and avoid triggers; monitor for interactions with anesthetic drugs.',
        'anemia': 'Lower oxygen reserve/transfusion threshold considerations; optimize and trend hemoglobin.',
        'liver disease': 'Coagulopathy and altered drug metabolism risk; assess bleeding and dose sensitivity.',
        'chronic pain': 'Opioid tolerance/hyperalgesia may increase analgesic needs; use multimodal peri-op plan.',
        'depression': 'Usually continue antidepressants; monitor for serotonergic/QT/hemodynamic interaction contexts.',
        'anxiety': 'Higher peri-op anxiety and potential chronic benzo/SSRI exposure; tailor anxiolysis and monitoring.',
        'cancer': 'Treatment-related cardiopulmonary, hematologic, and airway effects may alter peri-op risk.',
        'myasthenia gravis': 'Major neuromuscular blocker sensitivity/resistance considerations; tailor NMB and reversal strategy.',
        'parkinson s disease': 'Continue Parkinson meds as close to schedule as possible; missed doses can worsen rigidity/airway function.',
        'pheochromocytoma': 'High catecholamine/hemodynamic instability risk; requires specialized peri-op planning.',
        'pulmonary hypertension': 'High RV/hemodynamic risk; avoid hypoxia/hypercarbia/acidosis and maintain RV perfusion.'
      };
      if (exact[key]) return exact[key];

      var containsRules = [
        [/\b(osa|sleep apnea|obesity hypoventilation|ohs)\b/, 'Airway/respiratory depression risk; prioritize opioid-sparing strategy and post-op monitoring.'],
        [/\b(copd|asthma|bronchiectasis|pulmonary fibrosis|reactive airway)\b/, 'Higher pulmonary complication risk; optimize bronchodilation and ventilation strategy.'],
        [/\b(chf|heart failure|cardiomyopathy|cad|angina|mi|coronary)\b/, 'Cardiac risk context; avoid hemodynamic instability and optimize myocardial oxygen balance.'],
        [/\b(afib|atrial fibrillation|arrhythmia|svt|pacemaker|icd)\b/, 'Rhythm/conduction and device considerations may affect peri-op monitoring and management.'],
        [/\b(ckd|esrd|renal|dialysis)\b/, 'Renal dysfunction affects drug clearance, fluid, and electrolyte strategy.'],
        [/\b(cirrhosis|hepatitis|liver|nash|nafld)\b/, 'Hepatic dysfunction may increase bleeding risk and alter anesthetic drug metabolism.'],
        [/\b(diabetes|t1dm|t2dm|dm)\b/, 'Peri-op glucose management is key; adjust diabetes therapy for NPO status.'],
        [/\b(stroke|tia|cva)\b/, 'Cerebrovascular risk context; avoid major blood-pressure swings peri-op.'],
        [/\b(seizure|epilepsy)\b/, 'Continue antiseizure therapy and account for interactions with anesthetic medications.'],
        [/\b(myasthenia gravis)\b/, 'Major neuromuscular blocker sensitivity/resistance considerations; tailor NMB and reversal strategy.'],
        [/\b(parkinson|parkinsonism)\b/, 'Continue Parkinson meds near schedule; missed doses can worsen rigidity and respiratory function.'],
        [/\b(pulmonary hypertension)\b/, 'High RV/hemodynamic risk; avoid hypoxia, hypercarbia, and acidosis.'],
        [/\b(anemia|sickle|thalassemia|coagulopathy|hemophilia|von willebrand|thrombocytopenia)\b/, 'Hematologic reserve/bleeding considerations may alter transfusion and neuraxial planning.'],
        [/\b(chronic pain|opioid|substance use|alcohol use disorder)\b/, 'Tolerance/withdrawal and analgesic complexity may require multimodal peri-op planning.'],
        [/\b(cancer|malignancy|chemotherapy|radiation)\b/, 'Treatment-related cardiopulmonary, hematologic, and airway effects may alter peri-op risk.'],
        [/\b(obesity)\b/, 'Difficult airway/hypoventilation risk and dosing considerations; plan airway and ventilation strategy.'],
        [/\b(gerd|reflux|gastroparesis)\b/, 'Aspiration-risk context; consider reflux/aspiration precautions when indicated.']
      ];
      for (var i = 0; i < containsRules.length; i++) {
        if (containsRules[i][0].test(key)) return containsRules[i][1];
      }
      return 'None.';
    }

    function showPmhInfo(itemText) {
      var name = String(itemText || '').trim();
      if (!name) return;
      var modal = document.getElementById('pmh-info-modal');
      var nameEl = document.getElementById('pmh-info-name');
      var anesEl = document.getElementById('pmh-info-anes');
      if (!modal || !nameEl || !anesEl) return;
      nameEl.textContent = name;
      anesEl.textContent = getPmhAnesConsiderations(name);
      modal.style.display = 'flex';
    }

    function closePmhInfoModal() {
      var modal = document.getElementById('pmh-info-modal');
      if (modal) modal.style.display = 'none';
    }

    document.addEventListener('keydown', function(e) {
      if (e.key !== 'Escape') return;
      var modal = document.getElementById('pmh-info-modal');
      if (!modal || modal.style.display !== 'flex') return;
      closePmhInfoModal();
    });

    function getLegacyCheckedPmhItems(state) {
      var s = state || {};
      var ids = Object.keys(PMH_LEGACY_CHECKBOX_LABELS);
      var picked = [];
      for (var i = 0; i < ids.length; i++) {
        var id = ids[i];
        var v = s[id];
        if (v === true || v === 'true' || v === 1 || v === '1' || v === 'on' || v === 'yes') {
          picked.push(PMH_LEGACY_CHECKBOX_LABELS[id]);
        }
      }
      return picked;
    }

    function normalizePmhText(text) {
      return String(text || '').toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
    }

    function expandPmhAbbrev(input) {
      var v = input.value.trim().toLowerCase();
      if (PMH_ABBREVS[v]) { input.value = PMH_ABBREVS[v]; savePmhRows(); }
    }

    function addPmhRow(value) {
      if (pmhRowCount >= 30) return;
      pmhRowCount++;

      var row = document.createElement('div');
      row.className = 'pmh-row';

      var input = document.createElement('input');
      input.className = 'long';
      input.placeholder = 'PMH item';
      input.setAttribute('autocomplete', 'off');
      if (value) {
        input.value = value;
        input.setAttribute('list', 'pmh-dx-suggestions');
      }
      input.addEventListener('input', function() {
        ensurePmhSuggestions();
        if (input.value.trim()) {
          input.setAttribute('list', 'pmh-dx-suggestions');
        } else {
          input.removeAttribute('list');
        }
      });
      input.addEventListener('input', savePmhRows);
      input.addEventListener('blur', function() { expandPmhAbbrev(input); });
      input.addEventListener('keydown', function(e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        expandPmhAbbrev(input);
        addPmhFromInput(input);
      });

      var infoBtn = document.createElement('button');
      infoBtn.type = 'button';
      infoBtn.className = 'pmh-info-btn';
      infoBtn.textContent = '?';
      infoBtn.title = 'PMH anesthesia info';
      infoBtn.addEventListener('click', function() {
        var val = String(input.value || '').trim();
        if (!val) return;
        showPmhInfo(val);
      });

      var rm = document.createElement('button');
      rm.type = 'button';
      rm.className = 'row-remove-btn';
      rm.textContent = 'Delete';
      rm.onclick = function() {
        row.remove();
        if (document.querySelectorAll('#pmh-list .pmh-row').length === 0) addPmhRow('');
        savePmhRows();
      };

      row.appendChild(infoBtn);
      row.appendChild(input);
      row.appendChild(rm);
      document.getElementById('pmh-list').appendChild(row);
      savePmhRows();
    }

    function savePmhRows() {
      var s = getGlobalState();
      var rows = Array.from(document.querySelectorAll('#pmh-list .pmh-row input')).map(function(el) {
        return el.value || '';
      });
      s['pmh-list'] = JSON.stringify(rows);
      setGlobalState(s);
    }

    function restorePmhRows() {
      var list = document.getElementById('pmh-list');
      list.innerHTML = '';
      pmhRowCount = 0;

      var s = getGlobalState();
      var rows = [];
      try { rows = JSON.parse(s['pmh-list']) || []; } catch (e) {}
      var legacyChecked = getLegacyCheckedPmhItems(s);
      if (!Array.isArray(rows)) rows = [];
      if (legacyChecked.length) {
        var seen = {};
        rows = rows.map(function(item) { return String(item || '').trim(); }).filter(function(item) {
          if (!item) return false;
          var key = normalizePmhText(item);
          if (!key || seen[key]) return false;
          seen[key] = true;
          return true;
        });
        legacyChecked.forEach(function(item) {
          var key = normalizePmhText(item);
          if (!key || seen[key]) return;
          seen[key] = true;
          rows.push(item);
        });
      }
      if (!rows.length) rows = [''];

      rows.forEach(function(item) {
        addPmhRow(item || '');
      });
    }

    function saveSurgicalHistory() {
      var s = getGlobalState();
      var rows = Array.from(document.querySelectorAll('#psh-list .pmh-row input')).map(function(el) {
        return el.value || '';
      });
      s['pmh-surgical-history'] = JSON.stringify(rows);
      setGlobalState(s);
    }

    var pshRowCount = 0;

    function addPshRow(value) {
      if (pshRowCount >= 30) return;
      pshRowCount++;

      var row = document.createElement('div');
      row.className = 'pmh-row';

      var input = document.createElement('input');
      input.className = 'long';
      input.placeholder = 'Surgery / procedure';
      if (value) input.value = value;
      input.addEventListener('input', saveSurgicalHistory);
      input.addEventListener('keydown', function(e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        var rows = Array.from(document.querySelectorAll('#psh-list .pmh-row'));
        var idx = rows.indexOf(row);
        if (idx < rows.length - 1) {
          var next = rows[idx + 1].querySelector('input');
          if (next) next.focus();
        } else {
          addPshRow('');
          var allRows = document.querySelectorAll('#psh-list .pmh-row');
          var lastInput = allRows[allRows.length - 1].querySelector('input');
          if (lastInput) lastInput.focus();
        }
      });

      var rm = document.createElement('button');
      rm.type = 'button';
      rm.className = 'row-remove-btn';
      rm.textContent = 'Delete';
      rm.onclick = function() {
        row.remove();
        if (document.querySelectorAll('#psh-list .pmh-row').length === 0) addPshRow('');
        saveSurgicalHistory();
      };

      row.appendChild(input);
      row.appendChild(rm);
      document.getElementById('psh-list').appendChild(row);
      saveSurgicalHistory();
    }

    function restoreSurgicalHistory() {
      var list = document.getElementById('psh-list');
      list.innerHTML = '';
      pshRowCount = 0;

      var s = getGlobalState();
      var raw = s['pmh-surgical-history'] || '';
      var rows = [];
      try { rows = JSON.parse(raw); } catch (e) {
        // Legacy: plain text — split by newline
        if (raw.trim()) rows = raw.split('\n').map(function(l) { return l.trim(); }).filter(Boolean);
      }
      if (!Array.isArray(rows) || !rows.length) rows = [''];
      rows.forEach(function(item) { addPshRow(item || ''); });
    }

    pageBoot(function() {
      restorePmhRows();
      restoreSurgicalHistory();
    }, function() {
      // Don't wipe a row the user is actively typing in
      var active = document.activeElement;
      if (!active || !active.closest('#pmh-list')) restorePmhRows();
      if (!active || !active.closest('#psh-list')) restoreSurgicalHistory();
    });
  </script>
