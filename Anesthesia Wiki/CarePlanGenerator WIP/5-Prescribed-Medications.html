    let medAliasLookup = null;

    function normalizeMedKey(text) {
      return String(text || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function levenshtein(a, b) {
      var m = a.length, n = b.length;
      var prev = [], curr = [];
      for (var j = 0; j <= n; j++) prev[j] = j;
      for (var i = 1; i <= m; i++) {
        curr[0] = i;
        for (var j = 1; j <= n; j++) {
          curr[j] = a[i-1] === b[j-1]
            ? prev[j-1]
            : 1 + Math.min(prev[j], curr[j-1], prev[j-1]);
        }
        var tmp = prev; prev = curr; curr = tmp;
      }
      return prev[n];
    }

    function buildMedAliasLookup() {
      const map = new Map();
      const add = function(alias, med) {
        const key = normalizeMedKey(alias);
        if (!key || !med) return;
        if (!map.has(key)) map.set(key, med);
      };

      homeMeds.forEach(m => add(m, m));
      Object.keys(brandToGeneric).forEach(alias => {
        const generic = brandToGeneric[alias];
        if (homeMeds.indexOf(generic) !== -1) add(alias, generic);
      });

      return map;
    }

    function resolveMedication(query) {
      const raw = String(query || '').trim();
      if (!raw) return '';
      if (!medAliasLookup) medAliasLookup = buildMedAliasLookup();

      const exact = medAliasLookup.get(normalizeMedKey(raw));
      if (exact) return exact;

      // Try stripping trailing dose (e.g. "Aspirin 81mg" → "Aspirin", kept as-is in the field)
      var doseStripped = raw.replace(/\s+\d[\d./]*\s*(mg|mcg|ml|g|iu|mEq|mmol|units?|tabs?|caps?|%)?([\s+].*)?$/i, '').trim();
      if (doseStripped && doseStripped !== raw) {
        var doseExact = medAliasLookup.get(normalizeMedKey(doseStripped));
        if (doseExact) return doseExact;
      }

      const q = normalizeMedKey(raw);
      if (!q) return '';

      // Prefix match against all aliases/generics.
      const keys = Array.from(medAliasLookup.keys());
      for (let i = 0; i < keys.length; i++) {
        if (keys[i].indexOf(q) === 0) return medAliasLookup.get(keys[i]) || '';
      }

      // Contains match fallback.
      for (let i = 0; i < keys.length; i++) {
        if (keys[i].indexOf(q) !== -1) return medAliasLookup.get(keys[i]) || '';
      }

      // Spell-correction fallback: fuzzy match via Levenshtein distance.
      // Allow 1 edit for short words, 2 for medium, 3 for long.
      var maxDist = q.length < 5 ? 1 : q.length < 9 ? 2 : 3;
      var bestKey = null, bestDist = maxDist + 1;
      for (var fi = 0; fi < keys.length; fi++) {
        var k = keys[fi];
        // Skip keys whose length differs too much from query.
        if (Math.abs(k.length - q.length) > maxDist) continue;
        var d = levenshtein(q, k);
        if (d < bestDist) { bestDist = d; bestKey = k; }
      }
      if (bestKey !== null) return medAliasLookup.get(bestKey) || '';

      return '';
    }

    function ensureSuggestionList() {
      const list = document.getElementById('home-med-suggestions');
      if (!list || list.dataset.ready === '1') return;

      const frag = document.createDocumentFragment();

      homeMeds.forEach(function(m) {
        const opt = document.createElement('option');
        opt.value = m;
        frag.appendChild(opt);
      });
      Object.keys(brandToGeneric).forEach(function(alias) {
        const generic = brandToGeneric[alias];
        if (homeMeds.indexOf(generic) === -1) return;
        const opt = document.createElement('option');
        opt.value = alias;
        opt.label = generic;
        frag.appendChild(opt);
      });
      list.appendChild(frag);
      list.dataset.ready = '1';
    }

    function buildMedOptions() {
      let options = '<option value="">Select Medication...</option>';
      options += '<optgroup label="Home / Patient Meds">';
      homeMeds.forEach(m => { options += '<option value="' + m + '">' + m + '</option>'; });
      options += '</optgroup>';
      return options;
    }

    function ensureCustomMedOption(select, customName) {
      if (!select) return;
      var name = String(customName || '').trim();
      if (!name) return;

      var existing = Array.from(select.options).some(function(opt) {
        return opt.value === name;
      });
      if (existing) return;

      var isSystemMed = homeMeds.indexOf(name) !== -1;
      var opt = document.createElement('option');
      opt.value = name;
      opt.textContent = isSystemMed ? name : (name + ' (not in system yet)');
      if (!isSystemMed) opt.dataset.custom = '1';
      select.appendChild(opt);
    }

    function showMedInfo(i) {
      var inp = document.getElementById('med-input-' + i);
      if (!inp) return;
      var rawName = inp.value;
      if (!rawName) return;

      var modal = document.getElementById('med-info-modal');
      var nameEl = document.getElementById('med-info-name');
      var clsEl = document.getElementById('med-info-class');
      var indEl = document.getElementById('med-info-ind');
      var anesEl = document.getElementById('med-info-anes');
      if (!modal) return;

      // Try direct lookup, then try resolving brand→generic
      var resolved = rawName;
      var info = MED_INFO[rawName];
      if (!info) {
        var gen = resolveMedication(rawName);
        if (gen) { resolved = gen; info = MED_INFO[gen]; }
      }

      nameEl.textContent = resolved || rawName;
      if (info) {
        clsEl.textContent = info.cls;
        indEl.textContent = info.ind;
        anesEl.textContent = getAnesthesiaConsiderations(resolved, info);
      } else {
        clsEl.textContent = 'No information available';
        indEl.textContent = '—';
        anesEl.textContent = 'None.';
      }
      modal.style.display = 'flex';
    }

    function closeMedInfoModal() {
      var modal = document.getElementById('med-info-modal');
      if (modal) modal.style.display = 'none';
    }

    document.addEventListener('keydown', function(e) {
      if (e.key !== 'Escape') return;
      var modal = document.getElementById('med-info-modal');
      if (!modal || modal.style.display !== 'flex') return;
      closeMedInfoModal();
    });

    function addMedRow(medValue, otherValue) {
      if (currentMedRow >= 30) return;
      currentMedRow++;
      const i = currentMedRow;
      const row = document.createElement('div');
      row.className = 'row med-row';
      row.id = 'med-row-' + i;

      row.innerHTML = '<button type="button" class="med-info-btn" onclick="showMedInfo(' + i + ')" title="Drug info">?</button>' +
        '<input id="med-input-' + i + '" class="long" placeholder="Type medication..." autocomplete="off" oninput="handleMedChange(this,' + i + ')" onkeydown="handleMedKeydown(event,' + i + ')" />' +
        '<button type="button" class="row-remove-btn" onclick="removeMedRow(' + i + ')">Delete</button>';

      document.getElementById('meds-container').appendChild(row);

      const input = document.getElementById('med-input-' + i);
      const normalizedMed = (medValue === 'Other' && otherValue) ? otherValue : (medValue || '');
      if (normalizedMed) {
        input.value = normalizedMed;
        ensureSuggestionList();
        input.setAttribute('list', 'home-med-suggestions');
      }
      checkMedicationRow(i);
    }

    function checkMedicationRow(i) {
      const row = document.getElementById('med-row-' + i);
      if (!row) return;
      row.classList.remove('alert');
      saveState();
      saveMedRows();
    }

    function markMedUnknown(input) {
      var val = (input.value || '').trim();
      if (!val) { input.classList.remove('med-input-unknown'); input.title = ''; return; }
      var resolved = resolveMedication(val);
      if (!resolved) {
        input.classList.add('med-input-unknown');
        input.title = 'Not found in medication list — will be saved as entered';
      } else {
        input.classList.remove('med-input-unknown');
        input.title = '';
      }
    }

    function handleMedChange(inputEl, i) {
      ensureSuggestionList();
      if (inputEl.value.trim()) {
        inputEl.setAttribute('list', 'home-med-suggestions');
      } else {
        inputEl.removeAttribute('list');
      }
      markMedUnknown(inputEl);
      checkMedicationRow(i);
      saveMedRows();
    }

    function handleMedKeydown(ev, i) {
      if (ev.key !== 'Enter') return;
      ev.preventDefault();
      // Resolve brand name / fuzzy match before saving
      var input = document.getElementById('med-input-' + i);
      if (input && input.value.trim()) {
        var typed = input.value.trim();
        var resolved = resolveMedication(typed);
        if (resolved) {
          // Only substitute for a true brand→generic swap.
          // If the typed text already starts with the resolved name (e.g. "Aspirin 81mg"),
          // it's just a dose suffix — leave the text alone so the user keeps what they typed.
          var isSameDrug = typed.toLowerCase() === resolved.toLowerCase() ||
            (typed.toLowerCase().indexOf(resolved.toLowerCase()) === 0 &&
             !/[a-z]/i.test(typed[resolved.length]));
          if (!isSameDrug) {
            input.value = resolved;
            input.setAttribute('list', 'home-med-suggestions');
          }
        }
        markMedUnknown(input);
      }
      saveMedRows();
      // Find next row input after this one
      var allInputs = Array.from(document.querySelectorAll('#meds-container .med-row input[id^="med-input-"]'));
      var curIdx = allInputs.findIndex(function(el) { return el.id === 'med-input-' + i; });
      var nextInput = allInputs[curIdx + 1] || null;
      if (nextInput) {
        nextInput.focus();
      } else {
        addMedRow();
        var newInputs = document.querySelectorAll('#meds-container .med-row input[id^="med-input-"]');
        var newest = newInputs[newInputs.length - 1];
        if (newest) newest.focus();
      }
    }

    function removeMedRow(i) {
      const row = document.getElementById('med-row-' + i);
      if (row) row.remove();
      if (!document.querySelector('#meds-container .med-row')) addMedRow();
      saveMedRows();
    }

    function saveMedRows() {
      const s = getGlobalState();
      const rows = Array.from(document.querySelectorAll('#meds-container .med-row')).map(function(row) {
        const input = row.querySelector('input[id^="med-input-"]');
        return {
          med: (input && input.value) || '',
          other: ''
        };
      });
      s['med-list'] = JSON.stringify(rows);
      setGlobalState(s);
    }

    function restoreMedRows() {
      const container = document.getElementById('meds-container');
      container.innerHTML = '';
      currentMedRow = 0;

      const s = getGlobalState();
      let rows = [];
      try { rows = JSON.parse(s['med-list']) || []; } catch (e) {}
      if (!rows.length) rows = [{ med: '', other: '' }];

      rows.forEach(function(item) {
        addMedRow(item.med || '', item.other || '');
      });
    }

    pageBoot(function() {
      restoreMedRows();
      ensureSuggestionList();
    }, function() {
      restoreMedRows();
    });
  </script>

  var a = document.createElement("a");

  a.href = base + "AnesthesiaWiki.html";
