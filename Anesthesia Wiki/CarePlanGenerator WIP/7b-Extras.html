    .row-remove-btn:hover { background:#ffe6e6; border-color:#d68f8f; }
    .add-row-btn { margin-top:8px; padding:3px 12px; font-size:12px; border:1px dashed #4a6fa5; border-radius:4px; background:#f0f5ff; color:#4a6fa5; cursor:pointer; font-weight:600; }
    .add-row-btn:hover { background:#dde8ff; }
  </style>

<body>
  <div class="container">
    <h1>7b. Extras</h1>
    <div class="nav">
      <a href="1-Patient-Demographics.html">1 Patient</a><a href="2-Surgery.html">2 Surgery</a><a href="3-Labs-Chemistries.html">3 Labs</a><a href="4-PMH.html">4 PMH</a><a href="5-Prescribed-Medications.html">5 Home Meds</a><a href="6-Preop-History.html">6 Preop Hx</a><a href="7-Airway-Exam.html">7 Airway</a><a href="7b-Extras.html">7b Extras</a><a href="8-Anesthetic-Plan.html">8 Anesthetic Plan</a><a href="8b-APFEL-PONV.html">8b APFEL/PONV</a><a href="9-Fluid-Blood-Plan.html">9 Fluid/Blood</a><a href="10-Vent-Settings.html">10 Vent</a>

    <div class="card" style="display:flex;flex-direction:column;gap:12px;">

      <div style="background:#f5f9ff;border:1px solid #d0e3fa;border-radius:6px;padding:14px;">
        <strong style="font-size:0.95em;">Access &amp; Equipment</strong>
        <div class="row" style="margin-top:10px;flex-wrap:wrap;gap:16px;">
          <label><input type="checkbox" id="equip-2piv"> 2nd PIV</label>
          <label><input type="checkbox" id="equip-central"> Central Line</label>
          <label><input type="checkbox" id="equip-aline"> Art Line</label>
          <label><input type="checkbox" id="equip-bilat-bp-cuff"> Bilateral BP cuff</label>
          <label><input type="checkbox" id="equip-ogtube"> OG Tube</label>
          <label><input type="checkbox" id="equip-foley"> Foley</label>
          <label><input type="checkbox" id="equip-lead"> Lead</label>
          <label><input type="checkbox" id="equip-face-foam"> Face foam</label>
          <label><input type="checkbox" id="equip-patient-goggles"> Patient goggles</label>
          <label><input type="checkbox" id="equip-ett-accordion"> ETT accordion</label>
          <label><input type="checkbox" id="equip-circuit-extender"> Circuit extender</label>
          <label><input type="checkbox" id="equip-bite-block"> Bite block</label>
          <label><input type="checkbox" id="equip-microbore-tubing"> Microbore tubing</label>
          <label><input type="checkbox" id="equip-bairhugger"> Bair Hugger</label>
          <span id="bair-hugger-wrap" style="display:none;align-items:center;gap:8px;">
            <label style="font-size:0.9em;">Blanket type</label>
            <select id="equip-bairhugger-type" class="med" style="width:190px;">
              <option value="">Select blanket...</option>
              <option>Upper Body</option>
              <option>Lower Body</option>
              <option>Full Access</option>
              <option>Pediatric</option>
              <option>Underbody</option>
              <option>Head &amp; Neck</option>
              <option>Lithotomy</option>
              <option>Flex Fit</option>
            </select>
          </span>
        </div>
        <hr style="border:none;border-top:1px solid #d0e3fa;margin:12px 0 8px;">
        <div id="extras-notes-list"></div>
        <button type="button" class="add-row-btn" onclick="addNoteRow('')">+ Add more</button>
      </div>

    </div>
  </div>
  <script src="shared.js"></script>
  <script>
    // ── Additional Notes (dynamic free-text list) ─────────────────────────────
    function saveNotes() {
      var rows = Array.from(document.querySelectorAll('#extras-notes-list .pmh-row input')).map(function(el) {
        return el.value;
      });
      var s = getGlobalState();
      s['extras-notes'] = rows;
      setGlobalState(s);
    }

    var noteRowCount = 0;

    function addNoteRow(value) {
      if (noteRowCount >= 30) return;
      noteRowCount++;

      var row = document.createElement('div');
      row.className = 'pmh-row';

      var input = document.createElement('input');
      input.className = 'long';
      input.placeholder = 'Add a note…';
      if (value) input.value = value;
      input.addEventListener('input', saveNotes);
      input.addEventListener('keydown', function(e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        var rows = Array.from(document.querySelectorAll('#extras-notes-list .pmh-row'));
        var idx = rows.indexOf(row);
        if (idx < rows.length - 1) {
          var next = rows[idx + 1].querySelector('input');
          if (next) next.focus();
        } else {
          addNoteRow('');
          var allRows = document.querySelectorAll('#extras-notes-list .pmh-row');
          var lastInput = allRows[allRows.length - 1].querySelector('input');
          if (lastInput) lastInput.focus();
        }
      });

      var rm = document.createElement('button');
      rm.type = 'button';
      rm.className = 'row-remove-btn';
      rm.textContent = 'Delete';
      rm.onclick = function() {
        row.remove();
        noteRowCount--;
        if (document.querySelectorAll('#extras-notes-list .pmh-row').length === 0) addNoteRow('');
        saveNotes();
      };

      row.appendChild(input);
      row.appendChild(rm);
      document.getElementById('extras-notes-list').appendChild(row);
      saveNotes();
    }

    function restoreNotes(vals) {
      var list = document.getElementById('extras-notes-list');
      list.innerHTML = '';
      noteRowCount = 0;
      if (!vals || !vals.length) { addNoteRow(''); return; }
      vals.forEach(function(v) { addNoteRow(v || ''); });
    }

    function syncBairHugger() {
      var chk = document.getElementById('equip-bairhugger');
      document.getElementById('bair-hugger-wrap').style.display = chk && chk.checked ? 'inline-flex' : 'none';
      saveState();
    }

    function boot() {
      ['equip-2piv','equip-central','equip-aline','equip-bilat-bp-cuff','equip-ogtube','equip-foley','equip-lead','equip-face-foam','equip-patient-goggles','equip-ett-accordion','equip-circuit-extender','equip-bite-block','equip-microbore-tubing','equip-bairhugger'].forEach(function(id) {
        var el = document.getElementById(id);
        if (el) el.addEventListener('change', function() { syncBairHugger(); saveState(); });
      });
      var bhType = document.getElementById('equip-bairhugger-type');
      if (bhType) bhType.addEventListener('change', saveState);
      syncBairHugger();
      restoreNotes([]);
    }

    pageBoot(boot, function(s) {
      syncBairHugger();
      restoreNotes(s['extras-notes'] || []);
    });
  </script>
