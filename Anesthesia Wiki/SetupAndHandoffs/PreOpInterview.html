<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRNA Assessment Practice - Trevor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.5;
            color: #333;
            max-width: 850px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f0f2f5;
        }
        .header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            border-radius: 10px 10px 0 0;
            text-align: center;
        }
        .controls {
            background: #ecf0f1;
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #dcdde1;
        }
        .control-btn {
            padding: 5px 15px;
            margin: 0 5px;
            cursor: pointer;
            border: 1px solid #bdc3c7;
            background: white;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        .control-btn:hover { background: #f8f9fa; }
        
        .container {
            background: white;
            padding: 25px;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        details {
            margin-bottom: 10px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        summary {
            font-weight: bold;
            font-size: 1.1rem;
            text-transform: uppercase;
            padding: 10px;
            cursor: pointer;
            list-style: none;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        summary::-webkit-details-marker { display: none; }
        summary::after { content: '▼'; font-size: 0.8rem; }
        details[open] summary::after { content: '▲'; }

        /* Color Coding */
        .color-basics { background-color: #ebf5fb; color: #2980b9; }    
        .color-neuro { background-color: #f5eef8; color: #8e44ad; }     
        .color-endo { background-color: #eafaf1; color: #27ae60; }      
        .color-cardiac { background-color: #fdedec; color: #c0392b; }   
        .color-resp { background-color: #fef5e7; color: #d35400; }      
        .color-gi { background-color: #e8f8f5; color: #16a085; }        
        .color-airway { background-color: #ebedef; color: #2c3e50; }    
        .color-dental { background-color: #f2f4f4; color: #7f8c8d; }    
        .color-questions { background-color: #fef9e7; color: #e67e22; }

        .check-item {
            display: grid;
            grid-template-columns: 30px 1fr;
            align-items: start;
            margin-top: 10px;
            margin-left: 10px;
            cursor: pointer;
            padding: 6px;
            border-radius: 5px;
        }
        .check-item:hover { background-color: #f8f9fa; }
        input[type="checkbox"] { margin-top: 5px; width: 18px; height: 18px; }
        .text-content { font-size: 1.05rem; }
        .completed { color: #95a5a6; text-decoration: line-through; }
        
        .reminder-box {
            background-color: #fff3cd;
            border-left: 5px solid #ffc107;
            padding: 15px;
            margin: 15px 10px;
            font-weight: bold;
            font-style: italic;
            border-radius: 4px;
        }

        .reset-container {
            position: sticky;
            bottom: 20px;
            text-align: center;
            margin-top: 20px;
        }
        .reset-btn {
            padding: 12px 30px;
            background: #d9534f;
            color: white;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        @media (max-width: 700px) {
            .top-nav {
                display: none;
            }
            body {
                padding: 10px;
            }
            .header {
                padding: 10px 12px;
            }
            .header h1 {
                margin: 0;
                font-size: 1.2rem;
                line-height: 1.2;
            }
            summary {
                font-size: 0.95rem;
                padding: 8px;
            }
        }
    </style>
</head>
<body>
<div class="top-nav" style="position:fixed;top:10px;left:10px;z-index:9999;display:flex;gap:8px;">


</div>

<div class="header">
    <h1>Pre-Op Interview</h1>
</div>

<div class="container">
    
    <details>
        <summary class="color-basics">1. Inro / Rapport</summary>
        <label class="check-item"><input type="checkbox"><span class="text-content">Introduction and Title</span></label>
        <label class="check-item"><input type="checkbox"><span class="text-content">"Reviewed chart, want to cofirm..."</span></label>
        <label class="check-item"><input type="checkbox"><span class="text-content">Verify Name / DOB / Surgery</span></label>
        <label class="check-item"><input type="checkbox"><span class="text-content">"Who is with you today?"</span></label>
        <label class="check-item"><input type="checkbox"><span class="text-content"><strong>HPI:</strong> "Why are you having this surgery."</span></label>
        <label class="check-item"><input type="checkbox"><span class="text-content">Confirm NPO status</span></label>
        <label class="check-item"><input type="checkbox"><span class="text-content">Family hx of anesthesia complications</span></label>
        <label class="check-item"><input type="checkbox"><span class="text-content">Allergies</span></label>
        <label class="check-item"><input type="checkbox"><span class="text-content">PONV or motion sickness?</span></label>
        <label class="check-item"><input type="checkbox"><span class="text-content">Blood products</span></label>
        <label class="check-item"><input type="checkbox"><span class="text-content">Confirm any chart abnormalities</span></label>
    </details>

    <details>
        <summary class="color-neuro">2. Neuro</summary>
        <label class="check-item"><input type="checkbox"><span class="text-content">Strokes or seizures</span></label>
        <label class="check-item"><input type="checkbox"><span class="text-content">Syncope</span></label>
    </details>

    <details>
        <summary class="color-endo">3. Endocrine</summary>
        <label class="check-item"><input type="checkbox"><span class="text-content">Thyroid / DM</span></label>
    </details>

    <details>
        <summary class="color-cardiac">4. Cardiac</summary>
        <label class="check-item"><input type="checkbox"><span class="text-content">Heart attack</span></label>
        <label class="check-item"><input type="checkbox"><span class="text-content">CP, palpitations, racing heart, HTN</span></label>
        <label class="check-item"><input type="checkbox"><span class="text-content">Flight of stairs</span></label>
    </details>

    <details>
        <summary class="color-resp">5. Respiratory</summary>
        <label class="check-item"><input type="checkbox"><span class="text-content">URI</span></label>
        <label class="check-item"><input type="checkbox"><span class="text-content">COPD, Asthma, OSA</span></label>
        <label class="check-item"><input type="checkbox"><span class="text-content">Smoke, Vape, Drink, Drugs</span></label>
    </details>

    <details>
        <summary class="color-gi">6. GI / Renal / Hepatic / Heme</summary>
        <label class="check-item"><input type="checkbox"><span class="text-content">Acid reflux or heartburn</span></label>
        <label class="check-item"><input type="checkbox"><span class="text-content">Liver or kidneys</span></label>
        <label class="check-item"><input type="checkbox"><span class="text-content">Bleed or bruises easily</span></label>
    </details>

    <details>
        <summary class="color-airway">7. Airway Exam</summary>
        <label class="check-item"><input type="checkbox"><span class="text-content">Examine oral cavity</span></label>
        <label class="check-item"><input type="checkbox"><span class="text-content">Ask neck mobility</span></label>
        <label class="check-item"><input type="checkbox"><span class="text-content">Do neck mobility</span></label>
        <label class="check-item"><input type="checkbox"><span class="text-content">Side to side</span></label>
    </details>

    <details>
        <summary class="color-dental">8. Dental</summary>
        <label class="check-item"><input type="checkbox"><span class="text-content">Dentures, partials, veneers</span></label>
        <label class="check-item"><input type="checkbox"><span class="text-content">Crowns or caps</span></label>
        <label class="check-item"><input type="checkbox"><span class="text-content">Loose, broken, missing teeth</span></label>
    </details>

    <details>
        <summary class="color-questions">9. Questions</summary>
        <label class="check-item"><input type="checkbox"><span class="text-content">"What else should I know?"</span></label>
        <label class="check-item"><input type="checkbox"><span class="text-content">"Spoke with Dr. ________________ about the anesthesia plan?"</span></label>
        <label class="check-item"><input type="checkbox"><span class="text-content">"Questions for me?"</span></label>
    </details>
</div>

<div class="reset-container">
    <button class="reset-btn" onclick="resetForm()">Reset Checklist</button>
</div>

<script>
    document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
        checkbox.addEventListener('change', function() {
            if (this.checked) {
                this.nextElementSibling.classList.add('completed');
            } else {
                this.nextElementSibling.classList.remove('completed');
            }
        });
    });

    function resetForm() {
        document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
            cb.checked = false;
            cb.nextElementSibling.classList.remove('completed');
        });
        window.scrollTo(0, 0);
    }

    function toggleAll(expand) {
        document.querySelectorAll('details').forEach(el => {
            el.open = expand;
        });
    }
</script>


<style>
.global-home-btn {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 9999;
  padding: 12px 18px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.45);
  background: linear-gradient(135deg, #0d6e6e, #1e8f5b);
  color: #ffffff;
  text-decoration: none;
  font-weight: 700;
  letter-spacing: 0.2px;
  box-shadow: 0 10px 24px rgba(0,0,0,0.25);
}
.global-home-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 14px 28px rgba(0,0,0,0.32);
}
.global-home-btn:active {
  transform: translateY(0);
}
</style>
<script>
(function () {
  var path = window.location.pathname;
  var depth = path.split("/").filter(Boolean).length;
  var base = "";
  for (var i = 1; i < depth; i++) { base += "../"; }
  var a = document.createElement("a");
  a.className = "global-home-btn";
  a.href = base + "AnesthesiaWiki.html";
  a.textContent = "Home";
  a.setAttribute("aria-label", "Go to Home");
  document.body.appendChild(a);
})();
</script>
</body>
</html>
