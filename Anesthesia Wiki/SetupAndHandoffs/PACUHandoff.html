    <h1>PACU Handoff Checklist</h1>

    <div class="section">
        <h2>1. Identification & Procedure</h2>
        <div class="item"><input type="checkbox" id="pt-id"><label for="pt-id"><strong>Patient Identity:</strong> Name & Age</label></div>
        <div class="item"><input type="checkbox" id="proc"><label for="proc"><strong>Surgical Procedure:</strong> Exactly what was done</label></div>
        <div class="item"><input type="checkbox" id="team"><label for="team"><strong>The Team:</strong> Surgeon, PA, and Anesthesiologist</label></div>
        <div class="item"><input type="checkbox" id="type"><label for="type"><strong>Type of Procedure:</strong> (Laparoscopic, Open, etc.)</label></div>

        <h2>2. Patient History</h2>
        <div class="item"><input type="checkbox" id="acute"><label for="acute"><strong>Acute Indication:</strong> Why are they having surgery today?</label></div>
        <div class="item"><input type="checkbox" id="chronic"><label for="chronic"><strong>PMH/PSH:</strong> Relevant comorbidities & past surgeries</label></div>
        <div class="item"><input type="checkbox" id="meds"><label for="meds"><strong>Meds/Allergies:</strong> Especially home anticoagulants or beta-blockers</label></div>

        <h2>3. Intraoperative Management</h2>
        <div class="item"><input type="checkbox" id="anes-type"><label for="anes-type"><strong>Anesthetic:</strong> GETA, TIVA, Spinal, or MAC</label></div>
        <div class="item"><input type="checkbox" id="opioid"><label for="opioid"><strong>Last Opioid:</strong> Dose and Time given</label></div>
        <div class="item"><input type="checkbox" id="intra-meds"><label for="intra-meds"><strong>Meds Given:</strong> Paralytics (Reversed?), Anti-emetics, Antibiotics</label></div>
        <div class="item"><input type="checkbox" id="fluids"><label for="fluids"><strong>I/O:</strong> Fluids, Blood loss (EBL), and Urine output</label></div>

        <h2>4. The Clinical Course</h2>
        <div class="item"><input type="checkbox" id="hemo"><label for="hemo"><strong>Hemodynamics:</strong> Post-induction hypotension or instability?</label></div>
        <div class="item"><input type="checkbox" id="interventions"><label for="interventions"><strong>Interventions:</strong> Pressors used or extra fluid boluses?</label></div>
        <div class="item"><input type="checkbox" id="unexpected"><label for="unexpected"><strong>Unexpected Events:</strong> Airway issues or rhythm changes?</label></div>

        <h2>5. PACU Plan & Disposition</h2>
        <div class="item"><input type="checkbox" id="expected"><label for="expected"><strong>Anticipated Problems:</strong> Pain, PONV, or agitation?</label></div>
        <div class="item"><input type="checkbox" id="suggested"><label for="suggested"><strong>Suggested Interventions:</strong> Specific BP targets or positioning</label></div>
        <div class="item"><input type="checkbox" id="contact"><label for="contact"><strong>Contact:</strong> Who is the primary person to page for issues?</label></div>
    </div>
