<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAMTIDE Game</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f4f7f6;
      color: #2f2a24;
      margin: 0;
      padding: 0 0 40px 0;
      text-align: center;
    }
    header {
      background: linear-gradient(135deg, #2f80c1 0%, #225f93 100%);
      color: #fff;
      padding: 18px 20px 14px;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: 0.01em;
    }
    .quiz-container {
      margin: 40px auto 0 auto;
      max-width: 440px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(44, 62, 80, 0.12);
      padding: 32px 18px 28px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }
    .quiz-prompt-label {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #6b8397;
    }
    .quiz-prompt {
      width: 100%;
      min-height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: #eef7ff;
      border: 2px solid #cfe3f5;
      color: #225f93;
      font-size: 1.2rem;
      font-weight: 700;
      padding: 16px;
      box-shadow: inset 0 1px 4px rgba(0,0,0,0.04);
    }
    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      margin-top: 4px;
    }
    .quiz-btn {
      padding: 12px 0;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      background: #f3f3f3;
      color: #2f2a24;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .quiz-btn:hover {
      background: #dceeff;
      color: #225f93;
    }
    .quiz-btn.selected {
      background: #225f93;
      color: #fff;
    }
    .quiz-feedback {
      font-size: 1.05rem;
      font-weight: 700;
      margin-top: 8px;
    }
    .quiz-answer-list {
      margin: 10px 0 0;
      padding: 0;
      list-style: none;
      width: 100%;
      text-align: left;
    }
    .quiz-answer-list li {
      background: #f7fbff;
      border: 1px solid #cfe3f5;
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 8px;
      color: #225f93;
      font-size: 0.96rem;
      font-weight: 600;
    }
    .quiz-submit {
      margin-top: 6px;
      padding: 10px 24px;
      font-size: 1rem;
      border-radius: 7px;
      border: none;
      background: #2f80c1;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .quiz-submit:hover {
      background: #1f5f93;
    }
    .quiz-next {
      margin-top: 18px;
      padding: 10px 24px;
      font-size: 1rem;
      border-radius: 7px;
      border: none;
      background: #225f93;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .quiz-next:hover {
      background: #163f63;
    }
  </style>
</head>
<body>
  <header>
    <h1>SAMTIDE Game</h1>
    <p>Select everything that belongs in the SAMTIDE group.</p>
  </header>
  <div class="quiz-container" id="quiz-container"></div>
  <script>
    const quizData = [
      { item: 'Suction', answer: 'S - Suction' },
      { item: 'OG tube', answer: 'S - Suction' },
      { item: 'Laryngoscope', answer: 'A - Airway' },
      { item: 'ETT (Stylette / Cuff check)', answer: 'A - Airway' },
      { item: 'Oral/Nasal Airways / Bite Block', answer: 'A - Airway' },
      { item: 'LMA', answer: 'A - Airway' },
      { item: 'Machine Check', answer: 'M - Machine & Monitors' },
      { item: 'Standard ASA (Pulse Ox, EKG, BP, Temp)', answer: 'M - Machine & Monitors' },
      { item: 'End-Tidal CO2', answer: 'M - Machine & Monitors' },
      { item: 'A-line setup/transducer', answer: 'M - Machine & Monitors' },
      { item: 'Tape (Eyes and Tube)', answer: 'T - Tape & Temp' },
      { item: 'Temp Probe (Esophageal/Skin)', answer: 'T - Tape & Temp' },
      { item: 'Bair hugger machine / blanket', answer: 'T - Tape & Temp' },
      { item: 'IV Fluids spiked & primed', answer: 'I - IVs & Liquids' },
      { item: 'Extra IV setup', answer: 'I - IVs & Liquids' },
      { item: 'Pressure bag', answer: 'I - IVs & Liquids' },
      { item: 'Induction meds drawn/labeled', answer: 'D - Drugs & Adjuvants' },
      { item: 'Emergency meds', answer: 'D - Drugs & Adjuvants' },
      { item: 'Agent', answer: 'D - Drugs & Adjuvants' },
      { item: 'Ambu bag', answer: 'E - Equipment & Extras' },
      { item: 'Face foam', answer: 'E - Equipment & Extras' },
      { item: 'Goggles for patient', answer: 'E - Equipment & Extras' },
      { item: 'ETT accordion', answer: 'E - Equipment & Extras' },
      { item: 'Circuit extenders', answer: 'E - Equipment & Extras' },
      { item: 'Lead for X-ray', answer: 'E - Equipment & Extras' }
    ];

    let currentGroup = '';
    let selectedItems = new Set();
    let currentOptions = [];
    let answerChecked = false;

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function groupItemsByAnswer(data) {
      const grouped = {};
      data.forEach(entry => {
        if (!grouped[entry.answer]) grouped[entry.answer] = [];
        grouped[entry.answer].push(entry.item);
      });
      return grouped;
    }

    const groupedData = groupItemsByAnswer(quizData);
    const categories = Object.keys(groupedData);

    function toggleChoice(item) {
      if (selectedItems.has(item)) {
        selectedItems.delete(item);
      } else {
        selectedItems.add(item);
      }

      document.querySelectorAll('.quiz-btn').forEach(btn => {
        const value = btn.getAttribute('data-item');
        btn.classList.toggle('selected', selectedItems.has(value));
      });
    }

    function arraysEqualAsSets(a, b) {
      if (a.length !== b.length) return false;
      const setA = new Set(a);
      for (const val of b) {
        if (!setA.has(val)) return false;
      }
      return true;
    }

    function newQuiz() {
      currentGroup = categories[Math.floor(Math.random() * categories.length)];
      selectedItems = new Set();
      answerChecked = false;

      const correctItems = groupedData[currentGroup];
      const distractors = quizData
        .filter(q => q.answer !== currentGroup)
        .map(q => q.item);

      const distractorCount = Math.min(4, distractors.length);
      const pickedDistractors = shuffle([...distractors]).slice(0, distractorCount);
      currentOptions = shuffle([...correctItems, ...pickedDistractors]);

      const container = document.getElementById('quiz-container');
      container.innerHTML = `
        <div class="quiz-prompt-label">SAMTIDE Group</div>
        <div class="quiz-prompt">${currentGroup}</div>
        <div class="quiz-options">
          ${currentOptions.map(item => `<button type="button" class="quiz-btn" data-item="${item.replace(/"/g, '&quot;')}">${item}</button>`).join('')}
        </div>
        <button type="button" class="quiz-submit">Next question</button>
        <div class="quiz-feedback" id="quiz-feedback"></div>
      `;

      container.querySelectorAll('.quiz-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          toggleChoice(btn.getAttribute('data-item'));
        });
      });

      const submitBtn = container.querySelector('.quiz-submit');
      if (submitBtn) {
        submitBtn.addEventListener('click', function() {
          if (answerChecked) {
            newQuiz();
            return;
          }
          window.checkAnswer();
        });
      }
    }

    window.checkAnswer = function() {
      answerChecked = true;
      const feedback = document.getElementById('quiz-feedback');
      const correctItems = groupedData[currentGroup];
      const selectedArray = Array.from(selectedItems);

      if (arraysEqualAsSets(selectedArray, correctItems)) {
        feedback.textContent = 'Correct!';
        feedback.style.color = '#1a7c50';
      } else {
        feedback.innerHTML = 'Not quite. Correct answers:' +
          '<ul class="quiz-answer-list">' +
          correctItems.map(item => `<li>${item}</li>`).join('') +
          '</ul>';
        feedback.style.color = '#b32424';
      }
      document.querySelectorAll('.quiz-btn').forEach(btn => {
        btn.disabled = true;
      });
      const submitBtn = document.querySelector('.quiz-submit');
      if (submitBtn) {
        submitBtn.textContent = 'Next question';
      }
    };

    newQuiz();
  </script>

<style>
.global-home-btn {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 9999;
  padding: 12px 18px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.45);
  background: linear-gradient(135deg, #0d6e6e, #1e8f5b);
  color: #ffffff;
  text-decoration: none;
  font-weight: 700;
  letter-spacing: 0.2px;
  box-shadow: 0 10px 24px rgba(0,0,0,0.25);
}
.global-home-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 14px 28px rgba(0,0,0,0.32);
}
.global-home-btn:active {
  transform: translateY(0);
}
</style>
<script>
(function () {
  var path = window.location.pathname;
  var depth = path.split("/").filter(Boolean).length;
  var base = "";
  for (var i = 1; i < depth; i++) { base += "../"; }
  var a = document.createElement("a");
  a.className = "global-home-btn";
  a.href = base + "AnesthesiaWiki.html";
  a.textContent = "Home";
  a.setAttribute("aria-label", "Go to Home");
  document.body.appendChild(a);
})();
</script>
</body>
</html>
