<script>
// Inline Firebase Auth (Google-only) — ../shared-auth.js 404s on the server.
(function (global) {
  'use strict';
  var FIREBASE_CONFIG = {
    apiKey:            'AIzaSyC64NnAB0rH9Ne5gFINhaFSbqkJ4ygYZfY',
    authDomain:        'anesthesia-wiki-saved-files.firebaseapp.com',
    projectId:         'anesthesia-wiki-saved-files',
    storageBucket:     'anesthesia-wiki-saved-files.firebasestorage.app',
    messagingSenderId: '493278937716',
    appId:             '1:493278937716:web:6d4055acbb6f5745810721'
  };
  var _auth=null,_user=null,_authReady=false,_pendingCallbacks=[],_changeListeners=[];
  function getOrCreateApp(){if(!global.firebase)return null;if(global.firebase.apps&&global.firebase.apps.length)return global.firebase.apps[0];try{return global.firebase.initializeApp(FIREBASE_CONFIG);}catch(e){return null;}}
  function tryInitAuth(){if(_auth)return true;var app=getOrCreateApp();if(!app||!global.firebase.auth)return false;_auth=global.firebase.auth(app);_auth.onAuthStateChanged(handleAuthChange);return true;}
  function ensureInit(){if(!tryInitAuth()){var a=0,p=setInterval(function(){a++;if(tryInitAuth()||a>80)clearInterval(p);},100);}}
  function handleAuthChange(user){_user=user;_authReady=true;if(user){var cbs=_pendingCallbacks.slice();_pendingCallbacks=[];cbs.forEach(function(cb){try{cb(user);}catch(e){}});}else{if(_pendingCallbacks.length>0)doGoogleSignIn();}_changeListeners.forEach(function(cb){try{cb(user);}catch(e){}});}
  function doGoogleSignIn(){if(!_auth){ensureInit();return;}var provider=new global.firebase.auth.GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});_auth.signInWithPopup(provider).catch(function(e){if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request'){alert(e.message||'Google sign-in failed. Ensure pop-ups are allowed.');}});}
  global.AnesthesiaAuth={
    requireAuth:function(onAuthed){ensureInit();if(_authReady&&_user){try{onAuthed(_user);}catch(e){}return;}_pendingCallbacks.push(onAuthed);if(_authReady&&!_user)doGoogleSignIn();},
    getUser:function(){return _user;},
    signOut:function(){return _auth?_auth.signOut():Promise.resolve();},
    onAuthChange:function(callback){_changeListeners.push(callback);if(_authReady){try{callback(_user);}catch(e){}}},
    showLogin:function(){ensureInit();doGoogleSignIn();}
  };
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',ensureInit);}else{ensureInit();}
})(window);
</script>
<script>
(function () {
  function updateAuthUI(user) {
    var nameEl = document.getElementById('header-auth-name');
    var btn    = document.getElementById('header-auth-btn');
    if (!nameEl || !btn) return;
    if (user) {
      var name = user.displayName || (user.email ? user.email.split('@')[0] : 'Signed in');
      nameEl.textContent = name;
      btn.textContent = 'Sign Out';
      btn.onclick = function() { if (window.AnesthesiaAuth) window.AnesthesiaAuth.signOut(); };
    } else {
      nameEl.textContent = '';
      btn.textContent = 'Log in for full access';
      btn.onclick = function() { if (window.AnesthesiaAuth) window.AnesthesiaAuth.showLogin(); };
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    if (!window.AnesthesiaAuth) return;
    window.AnesthesiaAuth.onAuthChange(updateAuthUI);
    window.AnesthesiaAuth.requireAuth(function () {});
  });
})();
</script>

<style>
.global-home-btn {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 9999;
  padding: 12px 18px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.45);
  background: linear-gradient(135deg, #0d6e6e, #1e8f5b);
  color: #ffffff;
  text-decoration: none;
  font-weight: 700;
  letter-spacing: 0.2px;
  box-shadow: 0 10px 24px rgba(0,0,0,0.25);
}
.global-home-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 14px 28px rgba(0,0,0,0.32);
}
.global-home-btn:active {
  transform: translateY(0);
}
</style>
<script>
(function () {
  var path = window.location.pathname;
  var depth = path.split("/").filter(Boolean).length;
  var base = "";
  for (var i = 1; i < depth; i++) { base += "../"; }
  var a = document.createElement("a");
  a.className = "global-home-btn";
  a.href = base + "AnesthesiaWiki.html";
  a.textContent = "Home";
  a.setAttribute("aria-label", "Go to Home");
  document.body.appendChild(a);
})();
</script>
