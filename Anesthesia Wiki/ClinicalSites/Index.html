<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical Sites</title>
    <link rel="stylesheet" href="clinical-sites.css?v=3.001">
</head>
<body>
<div class="top-nav">


</div>

<header>
    <h1>🏥 Clinical Sites WIP <span style="font-size:0.55em;font-weight:400;color:#8aa0b8;vertical-align:middle;">v3.001 — WIP</span></h1>
    <div id="header-auth">
        <span id="header-auth-name"></span>
        <button type="button" id="header-auth-btn">Log in for full access</button>
    </div>
</header>

<div id="save-status" style="text-align: center; padding: 8px; font-size: 0.82rem; color: #6ecfa0;"></div>

<input id="import-file" type="file" accept="application/json" style="display:none" onchange="importClinicalSites(event)">

<div class="container" id="sites-container"></div>

<script src="clinical-sites-data-utils.js?v=3.001"></script>
<script src="https://www.gstatic.com/firebasejs/12.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.12.0/firebase-auth-compat.js"></script>
<script src="clinical-sites-firebase-config.js?v=3.001"></script>
<script src="../shared-auth.js"></script>
<script>
(function () {
  function updateAuthUI(user) {
    var nameEl = document.getElementById('header-auth-name');
    var btn    = document.getElementById('header-auth-btn');
    if (!nameEl || !btn) return;
    if (user) {
      var name = user.displayName || (user.email ? user.email.split('@')[0] : 'Signed in');
      nameEl.textContent = name;
      btn.textContent = 'Sign Out';
      btn.onclick = function() { if (window.AnesthesiaAuth) window.AnesthesiaAuth.signOut(); };
    } else {
      nameEl.textContent = '';
      btn.textContent = 'Log in for full access';
      btn.onclick = function() { if (window.AnesthesiaAuth) window.AnesthesiaAuth.showLogin(); };
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    if (!window.AnesthesiaAuth) return;
    window.AnesthesiaAuth.onAuthChange(updateAuthUI);
    window.AnesthesiaAuth.requireAuth(function () {});
  });
})();
</script>
<script src="clinical-sites-cloud.js?v=3.001"></script>
<script src="clinical-sites-storage.js?v=3.001"></script>
<script src="clinical-sites-render.js?v=3.001"></script>
<script src="clinical-sites-actions.js?v=3.001"></script>

<style>
.global-home-btn {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 9999;
  padding: 12px 18px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.45);
  background: linear-gradient(135deg, #0d6e6e, #1e8f5b);
  color: #ffffff;
  text-decoration: none;
  font-weight: 700;
  letter-spacing: 0.2px;
  box-shadow: 0 10px 24px rgba(0,0,0,0.25);
}
.global-home-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 14px 28px rgba(0,0,0,0.32);
}
.global-home-btn:active {
  transform: translateY(0);
}
</style>
<script>
(function () {
  var path = window.location.pathname;
  var depth = path.split("/").filter(Boolean).length;
  var base = "";
  for (var i = 1; i < depth; i++) { base += "../"; }
  var a = document.createElement("a");
  a.className = "global-home-btn";
  a.href = base + "AnesthesiaWiki.html";
  a.textContent = "Home";
  a.setAttribute("aria-label", "Go to Home");
  document.body.appendChild(a);
})();
</script>
</body>
</html>
