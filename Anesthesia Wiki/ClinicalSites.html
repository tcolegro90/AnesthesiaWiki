<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical Sites</title>
    <link rel="stylesheet" href="ClinicalSites/clinical-sites.css">
</head>
<body>
<div style="position:fixed;top:10px;left:10px;z-index:9999;display:flex;gap:8px;">
<button type="button" onclick="window.history.back()" style="background:#1f2a37;color:#fff;border:none;text-decoration:none;padding:7px 13px;border-radius:20px;font-size:0.8rem;font-weight:600;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;box-shadow:0 2px 8px rgba(0,0,0,0.25);cursor:pointer;">&#8592; Back</button>
<a href="AnesthesiaWiki.html" style="background:#1f2a37;color:#fff;text-decoration:none;padding:7px 13px;border-radius:20px;font-size:0.8rem;font-weight:600;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;box-shadow:0 2px 8px rgba(0,0,0,0.25);display:flex;align-items:center;">Wiki Home</a>
</div>

<header>
    <h1>🏥 Clinical Sites</h1>
</header>

<div class="save-bar">
    <div class="save-actions">
        <button class="save-btn" onclick="saveAll()">Save All</button>
        <button class="aux-btn" onclick="exportClinicalSites()">Export</button>
        <button class="aux-btn" onclick="triggerImportClinicalSites()">Import</button>
    </div>
    <span id="save-status"></span>
</div>

<input id="import-file" type="file" accept="application/json" style="display:none" onchange="importClinicalSites(event)">

<div class="container" id="sites-container"></div>

<script src="ClinicalSites/clinical-sites-data-utils.js"></script>
<script src="ClinicalSites/clinical-sites-storage.js"></script>
<script src="ClinicalSites/clinical-sites-render.js"></script>
<script src="ClinicalSites/clinical-sites-actions.js"></script>
</body>
</html>
